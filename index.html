<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>싱가포르 대탈출 🦁</title>
<style>
  :root{
    --pink:#ff9ec4; --cream:#fff7f0; --ink:#4a3f55; --gold:#ffd97d; --pop:#ff6b9d;
    --shadow:0 6px 18px rgba(120,80,110,.18);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    background:linear-gradient(160deg,#ffe3ef,#e3f0ff);
    color:var(--ink); overflow:hidden; user-select:none;
    display:flex; justify-content:center; align-items:center;
  }
  #app{
    width:100%; max-width:480px; height:100dvh; max-height:900px;
    display:flex; flex-direction:column; position:relative;
    background:var(--cream); box-shadow:var(--shadow); overflow:hidden;
  }
  #topbar{ flex:0 0 auto; padding:12px 16px 8px; text-align:center;
    background:linear-gradient(180deg,#fff,rgba(255,255,255,0)); z-index:5; }
  #roomName{font-size:19px; font-weight:800; letter-spacing:-.3px;}
  #roomSub{font-size:12px; color:#9a8ba5; margin-top:2px;}
  #progress{margin-top:7px; height:7px; border-radius:99px; background:#f0e4ec; overflow:hidden;}
  #progressBar{height:100%; width:0%; border-radius:99px;
    background:linear-gradient(90deg,var(--pop),var(--gold)); transition:width .4s;}

  #scene{ flex:1 1 auto; position:relative; margin:6px 12px; border-radius:22px;
    overflow:hidden; box-shadow:inset 0 2px 10px rgba(0,0,0,.06);
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg,#241832,#3a2a4e); }
  #photoWrap{ position:relative; max-width:100%; max-height:100%; line-height:0; }
  #photoWrap::after{ content:""; position:absolute; inset:0;
    background:linear-gradient(180deg,rgba(15,8,24,.10),rgba(15,8,24,.36)); pointer-events:none; }
  .bgphoto{ display:block; max-width:100%; max-height:100%; width:auto; height:auto;
    -webkit-user-drag:none; user-select:none; }

  /* 반짝이는 '영역' (테두리 없이, 요소 크기만큼 넓게) */
  .spot-dot{ position:absolute; transform:translate(-50%,-50%); width:17%; height:12%;
    border-radius:18px; cursor:pointer; z-index:3; }
  .spot-dot::before{ content:""; position:absolute; inset:0; border-radius:inherit;
    background:radial-gradient(ellipse at center, rgba(255,255,255,.6), rgba(255,107,157,.32) 46%, rgba(255,107,157,0) 74%);
    animation:breathe 2.4s ease-in-out infinite; }
  .spot-dot::after{ content:""; position:absolute; inset:6%; border-radius:inherit;
    box-shadow:0 0 0 2px rgba(255,255,255,.55); animation:ring 2.4s ease-in-out infinite; }
  .spot-dot.solved::before,.spot-dot.solved::after{ animation:none; opacity:.15; }
  .spot-dot.nohint::before,.spot-dot.nohint::after{ display:none; }  /* ?hint=off : 반짝임 끄고 직접 찾기 (클릭영역은 유지) */
  @keyframes breathe{ 0%,100%{opacity:.45; transform:scale(.96)} 50%{opacity:1; transform:scale(1.04)} }
  @keyframes ring{ 0%,100%{opacity:.2} 50%{opacity:.75} }

  /* 기존 동그란 이모지 버튼 (아직 사진 안 받은 방) */
  .hotspot{ position:absolute; transform:translate(-50%,-50%);
    display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:3;
    width:56px; height:56px; border-radius:50%; font-size:29px;
    background:rgba(255,255,255,.88); box-shadow:0 4px 12px rgba(0,0,0,.34); transition:transform .15s; }
  .hotspot:active{transform:translate(-50%,-50%) scale(.86);}
  .hotspot.tappable::after{ content:""; position:absolute; inset:-14px; border-radius:50%; animation:pulse 1.8s infinite; }
  @keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(255,107,157,.45);} 70%{box-shadow:0 0 0 16px rgba(255,107,157,0);} 100%{box-shadow:0 0 0 0 rgba(255,107,157,0);} }
  .floaty{animation:floaty 3.5s ease-in-out infinite;}
  @keyframes floaty{0%,100%{translate:0 0}50%{translate:0 -6px}}

  /* 이동 네비게이션 */
  #navbar{ position:absolute; left:0; right:0; bottom:0; z-index:4;
    display:flex; flex-wrap:wrap; gap:7px; justify-content:center; align-items:flex-end;
    padding:14px 10px 12px; background:linear-gradient(0deg,rgba(40,20,45,.34),transparent); }
  .navBtn{ display:flex; align-items:center; gap:5px; padding:9px 14px; border-radius:99px;
    background:rgba(255,255,255,.94); font-size:13.5px; font-weight:800; color:var(--ink);
    box-shadow:0 4px 12px rgba(60,30,50,.25); cursor:pointer; transition:.12s; border:2px solid transparent; }
  .navBtn:active{transform:scale(.94);}
  .navBtn.go{border-color:var(--pop);} .navBtn.locked{opacity:.62; background:rgba(240,235,238,.9);}
  .navBtn .ar{font-size:15px;}

  /* 인벤토리 */
  #invWrap{flex:0 0 auto; padding:8px 12px 14px;}
  #invLabel{font-size:11px; color:#b3a4bd; margin:0 4px 5px; font-weight:700;}
  #inventory{ display:flex; gap:8px; overflow-x:auto; padding:7px 8px 20px; min-height:70px;
    background:#fff; border-radius:16px; box-shadow:var(--shadow); }
  .invItem{ flex:0 0 auto; width:42px; height:42px; border-radius:11px;
    background:linear-gradient(160deg,#fff,#fdeef5);
    display:flex; align-items:center; justify-content:center; font-size:22px;
    border:2px solid transparent; transition:.15s; position:relative; }
  .invItem.sel{border-color:var(--pop); background:#fff0f6; transform:translateY(-3px) scale(1.05);}
  .invItem .nm{position:absolute; bottom:-13px; left:50%; transform:translateX(-50%);
    font-size:8.5px; white-space:nowrap; color:#a294ac;}
  #invEmpty{color:#cbbcd4; font-size:13px; align-self:center; margin:auto; padding:12px;}

  /* 클로즈업 뷰 (요소 확대) */
  #closeup{ position:absolute; inset:0; z-index:28; background:rgba(12,6,20,.9);
    display:none; flex-direction:column; align-items:center; justify-content:center; padding:20px;
    backdrop-filter:blur(3px); }
  #cuImgWrap{ position:relative; max-width:100%; max-height:56%; }
  #cuImg{ max-width:100%; max-height:100%; border-radius:16px; box-shadow:0 16px 46px rgba(0,0,0,.6);
    -webkit-user-drag:none; }
  #cuLockBadge{ position:absolute; right:10px; bottom:10px; font-size:34px;
    filter:drop-shadow(0 3px 6px rgba(0,0,0,.6)); animation:floaty 3s ease-in-out infinite; }
  #cuCaption{ color:#fff; margin:16px 6px 4px; text-align:center; font-size:15px; line-height:1.55; white-space:pre-wrap; max-width:360px;}
  #cuActions{ display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; justify-content:center;}
  #cuClose{ position:absolute; top:14px; right:16px; width:38px; height:38px; border-radius:50%;
    background:rgba(255,255,255,.15); color:#fff; border:none; font-size:20px; cursor:pointer; z-index:2;}

  /* 모달 */
  #modalBg{ position:absolute; inset:0; background:rgba(60,40,60,.42);
    display:none; align-items:center; justify-content:center; z-index:30; backdrop-filter:blur(2px); padding:22px; }
  #modal{ width:100%; max-width:340px; background:var(--cream); border-radius:24px;
    padding:22px 20px 20px; box-shadow:0 20px 50px rgba(80,40,70,.35); text-align:center; animation:pop .25s; }
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  #modalEmoji{font-size:52px; line-height:1;}
  #modalTitle{font-size:18px; font-weight:800; margin:10px 0 6px;}
  #modalText{font-size:14px; line-height:1.55; color:#6d5f78; white-space:pre-wrap;}
  #lockInput{ width:100%; font-size:26px; text-align:center; letter-spacing:6px; margin-top:14px;
    padding:12px; border-radius:14px; border:2px solid #f0d9e6; background:#fff; color:var(--ink); font-weight:800; outline:none; }
  .keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px;}
  .key{padding:14px 0; font-size:20px; font-weight:800; border-radius:14px; background:#fff; box-shadow:var(--shadow); cursor:pointer; transition:.1s;}
  .key:active{transform:scale(.92); background:#ffeaf3;}
  .btn{ margin-top:16px; width:100%; padding:14px; border:none; border-radius:16px;
    background:linear-gradient(120deg,var(--pop),#ff9ec4); color:#fff; font-size:16px; font-weight:800; cursor:pointer; box-shadow:var(--shadow); }
  .btn:active{transform:scale(.97);}
  .btn.ghost{background:#fff; color:var(--pop); box-shadow:inset 0 0 0 2px #ffd1e3;}
  .btn.compact{width:auto; margin-top:0; padding:12px 20px;}

  #toast{ position:absolute; left:50%; bottom:150px; transform:translateX(-50%) translateY(20px);
    background:rgba(74,63,85,.94); color:#fff; padding:11px 18px; border-radius:99px;
    font-size:13.5px; font-weight:600; opacity:0; transition:.3s; z-index:40; pointer-events:none; max-width:80%; text-align:center; }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .overlay{ position:absolute; inset:0; z-index:50; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:30px;
    background:linear-gradient(160deg,#ffdff0,#dcecff); }
  .overlay h1{font-size:32px; margin:0 0 6px; letter-spacing:-.5px;
    background:linear-gradient(90deg,#ff6b9d,#ffa94d,#ff6b9d); -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;}
  .overlay p{font-size:15px; color:#6d5f78; line-height:1.7; margin:6px 0;}
  .bigemoji{font-size:70px; animation:floaty 3s ease-in-out infinite;}
  .deco{ position:absolute; font-size:26px; opacity:.55; pointer-events:none; animation:floaty 4.5s ease-in-out infinite; }
  .resetLink{position:absolute; top:10px; right:12px; font-size:11px; color:#c3b4cd; background:none; border:none; z-index:6; cursor:pointer;}
</style>
</head>
<body>
<div id="app">
  <button class="resetLink" onclick="resetGame()">처음부터</button>
  <div id="topbar">
    <div id="roomName">싱가포르 대탈출</div>
    <div id="roomSub"></div>
    <div id="progress"><div id="progressBar"></div></div>
  </div>
  <div id="scene"></div>
  <div id="invWrap">
    <div id="invLabel">🎒 가방</div>
    <div id="inventory"></div>
  </div>

  <!-- 클로즈업 뷰 -->
  <div id="closeup">
    <button id="cuClose" onclick="closeCloseup()">✕</button>
    <div id="cuImgWrap"><img id="cuImg" alt=""><div id="cuLockBadge"></div></div>
    <div id="cuCaption"></div>
    <div id="cuActions"></div>
  </div>

  <div id="modalBg"><div id="modal"></div></div>
  <div id="toast"></div>

  <div class="overlay" id="intro">
    <span class="deco" style="top:11%;left:13%;animation-delay:.2s">✨</span>
    <span class="deco" style="top:17%;right:14%;animation-delay:1.1s">🌴</span>
    <span class="deco" style="bottom:26%;left:16%;animation-delay:.7s">☁️</span>
    <span class="deco" style="bottom:18%;right:18%;animation-delay:1.6s">💫</span>
    <span class="deco" style="top:30%;left:24%;animation-delay:2s">🧳</span>
    <div class="bigemoji">🦁✈️</div>
    <h1>싱가포르 대탈출</h1>
    <p id="introText">우리 둘의 싱가포르 여행,<br>반짝이는 곳을 눌러 자세히 살펴보고<br>숨은 수수께끼를 풀어봐!</p>
    <button class="btn" style="max-width:220px" onclick="startGame()">시작하기 💗</button>
  </div>
</div>

<script>
/* ============================================================
   싱가포르 대탈출 — 클로즈업형 방탈출
   · 방 사진의 '반짝이는 포인트' 클릭 → 요소 확대(클로즈업 사진)
   · 클로즈업 안에서: 번호자물쇠 / 열쇠자물쇠 / 단서 / 아이템획득
   · 배경·클로즈업 사진은 교체 가능. 좌표는 사진(photoWrap) 기준 %.
   ============================================================ */

const ITEMS = {
  key:{emoji:"🔑", name:"열쇠"},
  map:{emoji:"🗺️", name:"지도"},
  card:{emoji:"🎟️", name:"교통카드"},
  frag1:{emoji:"🧩", name:"조각1"}, frag2:{emoji:"🧩", name:"조각2"},
  frag3:{emoji:"🧩", name:"조각3"}, frag4:{emoji:"🧩", name:"조각4"},
  flower:{emoji:"🌺", name:"꽃"},
};

/* 핫스팟 종류
   A) 클로즈업형:  {x,y,label, closeup:{img, caption, badge, action}}
        action.type = clue | numlock | keylock | give
   B) 기존 이모지형: {x,y,emoji,label, clue|give|lock ...}  (사진 아직 없는 방)
   exits[]: 이동버튼 (requireFlags/lockHint)
*/
const MAPS = {
  airport:{
    name:"창이공항 · 주얼", sub:"반짝이는 곳을 눌러 자세히 봐", photo:"img/airport.jpg",
    // 정답(answer)은 지금은 임시값. 실제 여행에서 발견한 값으로 나중에 교체.
    hotspots:[
      { x:15,y:6, w:26,h:9, label:"출발 전광판", closeup:{
        img:"img/closeup/board.jpg", badge:"🔎",
        caption:"✈️ 출발 전광판.\n우리 비행기는 '수라바야(SURABAYA)'행!\n편명은 SQ930 — 뒤 3자리가 캐리어 번호일지도?",
        action:{type:"clue"} }},
      { x:31,y:16, w:18,h:10, label:"안내데스크", closeup:{
        img:"img/closeup/infodesk.jpg", badge:"🗺️",
        caption:"ℹ️ 공항 안내데스크.\n친절한 직원이 여행 지도를 건네줬다.",
        action:{type:"give", give:["map"], success:"여행 지도를 얻었다! 🗺️"} }},
      { x:48,y:52, w:56,h:24, label:"캐리어", closeup:{
        img:"img/closeup/carrier.jpg", badge:"🔢",
        caption:"🧳 수하물 벨트에서 찾은 우리 가방.\n3자리 번호 자물쇠가 걸려 있어.",
        action:{type:"numlock", len:3, answer:"930",
          hint:"전광판에서 본 우리 항공편(SQ930) 뒤 3자리",
          success:"딸깍! 가방이 열리고 사물함 열쇠가 나왔다. 🔑",
          give:["key"], setFlag:"gotKey"} }},
      { x:84,y:44, w:28,h:18, label:"사물함", closeup:{
        img:"img/closeup/locker.jpg", badge:"🔑",
        caption:"🔐 열쇠로 잠긴 사물함.\n손잡이에 열쇠 구멍이 보여.",
        action:{type:"keylock", needItem:"key",
          noKey:"열쇠 구멍이 있어. 열쇠를 먼저 찾아야 할 것 같아.",
          success:"열쇠로 사물함을 열었다!\n교통카드가 들어 있었다. 이제 도심으로!",
          give:["card"], setFlag:"gotOut"} }},
    ],
    exits:[
      {to:"downtown", label:"싱가포르 중심지", emoji:"🏙️", dir:"right",
        requireFlags:["gotOut"], lockHint:"사물함을 열어 짐을 챙겨야 나갈 수 있어!"},
    ]
  },

  downtown:{
    name:"싱가포르 중심지", sub:"어디부터 가볼까? 네 곳을 모두 둘러봐", photo:"img/downtown.jpg",
    hotspots:[
      {x:30,y:34,emoji:"🚇",label:"MRT 노선도",
        clue:{e:"🚇",t:"지하철 노선도.\n네 명소가 표시돼 있어: 마리나베이·식물원·아랍스트리트·머라이언."}},
      {x:70,y:36,emoji:"🪧",label:"안내 표지판",
        clue:{e:"🪧",t:"각 명소에서 퍼즐을 풀면 '열쇠조각🧩'을 준대.\n네 조각을 다 모으면… 마지막 장소가 열린다?"}},
    ],
    exits:[
      {to:"marina", label:"마리나베이", emoji:"🏨", dir:"right"},
      {to:"garden", label:"실내 식물원", emoji:"🌿", dir:"right"},
      {to:"arab",   label:"아랍 스트리트", emoji:"🕌", dir:"right"},
      {to:"merlion",label:"머라이언 파크", emoji:"🦁", dir:"right"},
      {to:"sentosa",label:"센토사", emoji:"🏖️", dir:"right"},
      {to:"laupasat",label:"라우파삿", emoji:"🍢", dir:"right"},
      {to:"police",label:"무지개 경찰서", emoji:"🌈", dir:"right"},
      {to:"__ending", label:"우리의 호텔", emoji:"💝", dir:"right",
        requireFlags:["m_done","g_done","a_done","ml_done"],
        lockHint:"열쇠조각 4개를 다 모아야 열려! (네 명소를 모두 클리어)"},
    ]
  },

  sentosa:{
    name:"센토사", sub:"해변과 케이블카의 섬", photo:"img/sentosa.jpg",
    hotspots:[
      {x:50,y:28,emoji:"🏝️",label:"팔라완 비치",
        clue:{e:"🏝️",t:"아시아 최남단 표지판이 있는 다리.\n여기서 케이블카를 타면 유니버설로 갈 수 있어."}},
      {x:30,y:62,emoji:"🚡",label:"케이블카",
        clue:{e:"🚡",t:"섬을 잇는 케이블카.\n오른쪽 길로 가면 유니버설 스튜디오!"}},
    ],
    exits:[
      {to:"downtown", label:"중심지로", emoji:"🏙️", dir:"left"},
      {to:"universal", label:"유니버설", emoji:"🎢", dir:"right"},
    ]
  },

  universal:{
    name:"유니버설 스튜디오", sub:"지구본 앞 놀이공원", photo:"img/universal.jpg",
    hotspots:[
      {x:50,y:34,emoji:"🌐",label:"유니버설 지구본",
        clue:{e:"🌐",t:"빙글빙글 도는 거대한 지구본!\n둘이 인증샷 찍기 딱 좋은 곳."}},
    ],
    exits:[{to:"sentosa", label:"센토사로", emoji:"🏖️", dir:"left"}]
  },

  laupasat:{
    name:"라우파삿", sub:"옛 시장 호커센터", photo:"img/laupasat.jpg",
    hotspots:[
      {x:50,y:40,emoji:"🕰️",label:"시계탑",
        clue:{e:"🕰️",t:"빅토리아풍 철제 시계탑이 상징인 옛 시장.\n저녁이면 사테(꼬치) 노점 거리가 열려."}},
      {x:30,y:66,emoji:"🍢",label:"사테 거리", clue:{e:"🍢",t:"숯불 사테 냄새가 솔솔~ 여행 중 야식으로 최고!"}},
    ],
    exits:[{to:"downtown", label:"중심지로", emoji:"🏙️", dir:"left"}]
  },

  police:{
    name:"올드힐스트리트 경찰서", sub:"창문이 무지개색인 옛 경찰서", photo:"img/police.jpg",
    hotspots:[
      {x:34,y:36,emoji:"🌈",label:"무지개 창문",
        clue:{e:"🌈",t:"창문 덧문이 층마다 무지개색!\n빨강·주황·노랑·초록·파랑·보라 순으로 칠해져 있어."}},
      {x:64,y:44,emoji:"🟡",label:"노란 창문 구역", clue:{e:"🟡",t:"오른쪽 구역은 온통 노란 창문이 모여 있네."}},

        clue:{e:"🚔",t:"지금은 문화·예술 정보를 다루는 건물로 쓰여.\n바로 근처에 유명한 바쿠테(육골차) 집이 있대."}},

      {x:40,y:52,emoji:"🪧",label:"송파 간판", clue:{e:"🪧",t:"SONG FA bak kut teh · SINCE 1969.\n싱가포르 바쿠테 원조격 맛집이야."}},
    ],
    exits:[{to:"police", label:"경찰서로", emoji:"🚔", dir:"left"}]
  },

  marina:{
    name:"마리나베이 샌즈", sub:"밤이면 슈퍼트리에 불이 들어와", photo:"img/marina.jpg",
    hotspots:[
      {x:50,y:20,emoji:"🏨",label:"스카이파크",
        clue:{e:"🏨",t:"안내판: '슈퍼트리는 빨강 → 노랑 → 초록 순서로 빛난다'"}},
      {x:22,y:42,emoji:"🌳",label:"슈퍼트리 A", clue:{e:"🔴",t:"지금 빨갛게 빛나는 나무. (1번)"}},
      {x:50,y:48,emoji:"🌳",label:"슈퍼트리 B", clue:{e:"🟡",t:"지금 노랗게 빛나는 나무. (2번)"}},
      {x:78,y:42,emoji:"🌳",label:"슈퍼트리 C", clue:{e:"🟢",t:"지금 초록으로 빛나는 나무. (3번)"}},
      {x:35,y:64,emoji:"🌺",label:"화단", give:"flower", once:true, found:{e:"🌺",t:"예쁜 부겐빌레아 한 송이. 🌺"}},
      {x:66,y:64,emoji:"🔒",label:"빛의 자물쇠", once:true,
        lock:{len:3, answer:"123", hint:"빛나는 순서(빨강·노랑·초록)의 나무 번호를 순서대로!",
          success:"세 나무가 반짝! 열쇠조각을 얻었다. ✨", give:["frag1"], setFlag:"m_done"}},
    ],
    exits:[{to:"downtown", label:"중심지로", emoji:"🏙️", dir:"left"}]
  },

  garden:{
    name:"실내 식물원 · 클라우드 포레스트", sub:"안개 낀 실내 숲속", photo:"img/garden.jpg",
    hotspots:[
      {x:50,y:20,emoji:"⛲",label:"실내폭포", clue:{e:"⛲",t:"안내판: '피어난 꽃의 수를 세어보세요'"}},
      {x:26,y:44,emoji:"🌸",label:"분홍 꽃밭", clue:{e:"🌸",t:"분홍 꽃은 4송이."}},
      {x:74,y:44,emoji:"🌼",label:"노란 꽃밭", clue:{e:"🌼",t:"노란 꽃은 2송이."}},
      {x:50,y:64,emoji:"🔒",label:"꽃의 자물쇠", once:true,
        lock:{len:2, answer:"42", hint:"핀 꽃의 수 (분홍, 그다음 노랑)",
          success:"덩굴이 열렸다. 열쇠조각 획득! 🌿", give:["frag2"], setFlag:"g_done"}},
    ],
    exits:[{to:"downtown", label:"중심지로", emoji:"🏙️", dir:"left"}]
  },

  arab:{
    name:"아랍 스트리트 · 캄퐁글람", sub:"황금 돔과 알록달록한 골목", photo:"img/arab.jpg",
    hotspots:[
      {x:50,y:20,emoji:"🕌",label:"술탄 모스크", clue:{e:"🕌",t:"타일: '카펫을 파랑-빨강-노랑 순으로 밟으면 길이 열린다'"}},
      {x:24,y:46,emoji:"🟦",label:"파란 카펫", clue:{e:"🟦",t:"파란 카펫. (1번 자리)"}},
      {x:50,y:52,emoji:"🟥",label:"빨간 카펫", clue:{e:"🟥",t:"빨간 카펫. (2번 자리)"}},
      {x:76,y:46,emoji:"🟨",label:"노란 카펫", clue:{e:"🟨",t:"노란 카펫. (3번 자리)"}},
      {x:50,y:66,emoji:"🔒",label:"골목 자물쇠", once:true,
        lock:{len:3, answer:"123", hint:"파랑·빨강·노랑 카펫의 자리 번호를 순서대로!",
          success:"골목 끝 문이 열렸다. 열쇠조각 획득! 🪔", give:["frag3"], setFlag:"a_done"}},
    ],
    exits:[{to:"downtown", label:"중심지로", emoji:"🏙️", dir:"left"}]
  },

  merlion:{
    name:"머라이언 파크", sub:"물을 뿜는 사자상 앞", photo:"img/merlion.jpg",
    hotspots:[
      {x:50,y:22,emoji:"🦁",label:"머라이언", clue:{e:"🦁",t:"받침대 각인: '내가 뿜는 물줄기의 수를 세어라'"}},
      {x:30,y:46,emoji:"💧",label:"물줄기", clue:{e:"💧",t:"물줄기를 세어보니… 5줄기."}},
      {x:50,y:64,emoji:"🔒",label:"분수 자물쇠", once:true,
        lock:{len:1, answer:"5", hint:"머라이언이 뿜는 물줄기의 수",
          success:"분수가 멈추더니 열쇠조각이 나타났다! 🦁", give:["frag4"], setFlag:"ml_done"}},
    ],
    exits:[{to:"downtown", label:"중심지로", emoji:"🏙️", dir:"left"}]
  },
};

const FINAL = { answer:"0815", hint:"네 개의 조각에 적힌 숫자를 순서대로!\n(조각1·조각2·조각3·조각4)" };

let state = load() || {room:"airport", inv:[], flags:{}, done:{}};
let selected = null;
const HINTS = new URLSearchParams(location.search).get("hint")!=="off";  // ?hint=off 면 반짝임 숨김
const $ = s=>document.querySelector(s);
const scene=$("#scene"), inv=$("#inventory");

function save(){ localStorage.setItem("sg_escape", JSON.stringify(state)); }
function load(){ try{return JSON.parse(localStorage.getItem("sg_escape"));}catch(e){return null;} }
function resetGame(){
  if(!confirm("처음부터 다시 시작할까? (진행상황이 지워져)")) return;
  localStorage.removeItem("sg_escape");
  state={room:"airport", inv:[], flags:{}, done:{}}; selected=null;
  closeCloseup(); closeModal(); $("#intro").style.display="flex";
}
function startGame(){ $("#intro").style.display="none"; render(); }
window.addEventListener("load",()=>{
  // 배경/클로즈업 사진 미리 로드
  Object.values(MAPS).forEach(m=>{ if(m.photo){const i=new Image(); i.src=m.photo;}
    (m.hotspots||[]).forEach(h=>{ if(h.closeup){const i=new Image(); i.src=h.closeup.img;} }); });
  if(state.inv.length || Object.keys(state.flags).length || state.room!=="airport"){
    $("#intro").style.display="none"; render();
  }
});

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2000); }
function give(keys){ (Array.isArray(keys)?keys:[keys]).forEach(k=>{ if(!state.inv.includes(k)) state.inv.push(k); }); }
function has(k){ return state.inv.includes(k); }
function fragCount(){ return ["m_done","g_done","a_done","ml_done"].filter(f=>state.flags[f]).length; }

/* ---- 렌더 ---- */
function render(){
  const r=MAPS[state.room]; if(!r) return;
  $("#roomName").textContent=r.name; $("#roomSub").textContent=r.sub;

  const pct = state.flags.gotOut ? 10 + fragCount()/4*90 : 0;
  $("#progressBar").style.width=pct+"%";

  scene.innerHTML="";
  const wrap=document.createElement("div"); wrap.id="photoWrap";
  const bg=document.createElement("img"); bg.className="bgphoto"; bg.alt=""; bg.src=r.photo||("img/"+state.room+".jpg");
  wrap.appendChild(bg);

  r.hotspots.forEach((h,i)=>{
    const id=state.room+"_"+i;
    if(h.once && state.done[id]) return;
    if(h.showIf && !state.flags[h.showIf]) return;
    const el=document.createElement("div");
    el.style.left=h.x+"%"; el.style.top=h.y+"%";
    if(h.closeup){
      // 반짝이는 영역 (요소 크기만큼 넓게 / ?hint=off 면 반짝임만 숨김)
      el.className="spot-dot"+(state.done[id]?" solved":"")+(HINTS?"":" nohint");
      if(h.w) el.style.width=h.w+"%"; if(h.h) el.style.height=h.h+"%";
    } else {
      // 기존 이모지 버튼
      el.className="hotspot tappable floaty";
      el.style.animationDelay=(i*0.25)+"s"; el.textContent=h.emoji;
    }
    el.title=h.label||"";
    el.onclick=()=>tap(h,id);
    wrap.appendChild(el);
  });
  scene.appendChild(wrap);

  const nav=document.createElement("div"); nav.id="navbar";
  (r.exits||[]).forEach(ex=>{
    const ok = !ex.requireFlags || ex.requireFlags.every(f=>state.flags[f]);
    const b=document.createElement("div"); b.className="navBtn "+(ok?"go":"locked");
    const arL = ex.dir==="left" ? '<span class="ar">◀</span>' : '';
    const arR = ex.dir!=="left" ? '<span class="ar">▶</span>' : '';
    b.innerHTML = arL + (ok?ex.emoji:"🔒") + " " + ex.label + arR;
    b.onclick=()=>{ ok ? goTo(ex.to) : toast(ex.lockHint||"아직 갈 수 없어."); };
    nav.appendChild(b);
  });
  scene.appendChild(nav);

  renderInv(); save();
}
function renderInv(){
  inv.innerHTML="";
  if(!state.inv.length){ inv.innerHTML='<div id="invEmpty">아직 주운 게 없어. 반짝이는 곳을 눌러봐!</div>'; return; }
  state.inv.forEach(key=>{
    const it=ITEMS[key]; if(!it) return;
    const el=document.createElement("div"); el.className="invItem"+(selected===key?" sel":"");
    el.innerHTML=it.emoji+'<span class="nm">'+it.name+'</span>';
    el.onclick=()=>{ selected=(selected===key?null:key); renderInv(); if(selected) toast(it.name+" 선택됨"); };
    inv.appendChild(el);
  });
}
function goTo(to){ if(to==="__ending"){ openFinalLock(); return; } selected=null; state.room=to; render(); }

/* ---- 탭 ---- */
function tap(h,id){
  if(h.closeup){ openCloseup(h,id); return; }
  // 기존 이모지형
  if(h.lock){ const L=h.lock; if(h.needFlag && !state.flags[h.needFlag]){ toast("먼저 다른 걸 해결해야 할 것 같아."); return; }
    openLock(L, ()=>{ if(L.give)give(L.give); if(L.setFlag)state.flags[L.setFlag]=true; if(h.once)state.done[id]=true;
      showModal("🎉","열렸다!",L.success||"자물쇠가 풀렸다!"); render(); }); return; }
  if(h.give){ give(h.give); if(h.setFlag) state.flags[h.setFlag]=true; if(h.once) state.done[id]=true;
    const f=h.found||{e:ITEMS[h.give]?.emoji||"🎁",t:"뭔가 주웠다!"}; showModal(f.e,"획득!",f.t); render(); return; }
  if(h.clue){ showModal(h.clue.e,h.label||"단서",h.clue.t); return; }
}

/* ---- 클로즈업 뷰 ---- */
let cuCtx=null;
function openCloseup(h,id){
  cuCtx={h,id};
  const c=h.closeup, solved=!!state.done[id];
  $("#cuImg").src=c.img;
  $("#cuLockBadge").textContent = solved ? "✅" : (c.badge||"");
  $("#cuCaption").textContent = c.caption||"";
  const acts=$("#cuActions"); acts.innerHTML="";
  const a=c.action||{type:"clue"};
  if(solved){
    // 이미 해결됨
  } else if(a.type==="numlock"){
    const b=document.createElement("button"); b.className="btn compact"; b.textContent="🔢 번호 맞추기";
    b.onclick=()=>openLock(a, ()=>solveCloseup(a));
    acts.appendChild(b);
  } else if(a.type==="keylock"){
    const b=document.createElement("button"); b.className="btn compact"; b.textContent="🔑 열쇠로 열기";
    b.onclick=()=>{ if(has(a.needItem)) solveCloseup(a); else toast(a.noKey||"열쇠가 필요해."); };
    acts.appendChild(b);
  } else if(a.type==="give"){
    const b=document.createElement("button"); b.className="btn compact"; b.textContent="가져가기";
    b.onclick=()=>solveCloseup(a);
    acts.appendChild(b);
  }
  $("#closeup").style.display="flex";
}
function closeCloseup(){ $("#closeup").style.display="none"; cuCtx=null; }
function solveCloseup(a){
  const {id}=cuCtx;
  if(a.give) give(a.give);
  if(a.setFlag) state.flags[a.setFlag]=true;
  state.done[id]=true;
  closeCloseup();
  showModal("🎉","성공!",a.success||"해결했다!");
  render();
}

/* ---- 자물쇠 UI (번호 입력) — 콜백 기반 ---- */
let lockCtx=null;
function openLock(lock, onSuccess){ lockCtx={lock, val:"", onSuccess}; drawLock(lock.emoji||"🔒", lock.title||"번호 자물쇠"); }
function openFinalLock(){ openLock({len:FINAL.answer.length, answer:FINAL.answer, hint:FINAL.hint, emoji:"💝", title:"마지막 관문 · 우리의 호텔"}, ()=>showEnding()); }
function drawLock(emoji,title){
  const L=lockCtx.lock; const keys=[1,2,3,4,5,6,7,8,9,"←",0,"OK"];
  $("#modal").innerHTML=`
    <div id="modalEmoji">${emoji}</div>
    <div id="modalTitle">${title}</div>
    <div id="modalText">${L.hint||""}</div>
    <input id="lockInput" readonly value="" placeholder="${"•".repeat(L.len)}">
    <div class="keypad">${keys.map(k=>`<div class="key" onclick="lockKey('${k}')">${k}</div>`).join("")}</div>
    <button class="btn ghost" onclick="closeModal()">닫기</button>`;
  $("#modalBg").style.display="flex";
}
function lockKey(k){
  if(!lockCtx) return; const L=lockCtx.lock;
  if(k==="←") lockCtx.val=lockCtx.val.slice(0,-1);
  else if(k==="OK") return submitLock();
  else if(lockCtx.val.length<L.len) lockCtx.val+=k;
  $("#lockInput").value=lockCtx.val;
  if(lockCtx.val.length===L.len) setTimeout(submitLock,150);
}
function submitLock(){
  if(!lockCtx) return; const L=lockCtx.lock, val=lockCtx.val;
  if(val.length<L.len) return;
  if(val===L.answer){ const cb=lockCtx.onSuccess; lockCtx=null; closeModal(); if(cb) cb(); }
  else{
    lockCtx.val=""; const el=$("#lockInput"); if(el){ el.value=""; el.style.borderColor="#ff5a5a";
      el.animate([{transform:"translateX(-6px)"},{transform:"translateX(6px)"},{transform:"translateX(0)"}],{duration:250});
      setTimeout(()=>{ const e2=$("#lockInput"); if(e2) e2.style.borderColor=""; },300); }
    toast("음… 아닌 것 같아. 단서를 다시 봐!");
  }
}

/* ---- 모달 ---- */
function showModal(emoji,title,text,btn){
  $("#modal").innerHTML=`
    <div id="modalEmoji">${emoji}</div>
    <div id="modalTitle">${title}</div>
    <div id="modalText">${text}</div>
    <button class="btn" onclick="closeModal()">${btn||"좋아 👍"}</button>`;
  $("#modalBg").style.display="flex";
}
function closeModal(){ $("#modalBg").style.display="none"; lockCtx=null; }
$("#modalBg").addEventListener("click",e=>{ if(e.target.id==="modalBg") closeModal(); });

/* ---- 엔딩(임시 placeholder) ---- */
function showEnding(){
  closeModal(); closeCloseup();
  const ov=document.createElement("div"); ov.className="overlay";
  ov.innerHTML=`
    <div class="bigemoji">💝</div>
    <h1>도착!</h1>
    <p><b>[ 여기에 선물 힌트 ]</b><br>예) "침대 베개 밑을 확인해봐 🎁"</p>
    <p><b>[ 여기에 편지 ]</b><br><span style="font-size:13px;color:#9a8ba5">둘만 아는 이야기로 채우면 완성 💗</span></p>
    <button class="btn" style="max-width:220px" onclick="location.reload()">다시 보기</button>`;
  $("#app").appendChild(ov);
}
</script>
</body>
