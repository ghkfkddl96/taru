<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>싱가포르 여행 대소동 ✈️</title>
<style>
  :root{
    --pink:#ff9ec4; --cream:#fff7f0; --ink:#4a3f55; --gold:#ffd97d; --pop:#ff6b9d;
    --shadow:0 6px 18px rgba(120,80,110,.18);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    background:linear-gradient(160deg,#ffe3ef,#e3f0ff);
    color:var(--ink); overflow:hidden; user-select:none;
    display:flex; justify-content:center; align-items:center;
  }
  #app{
    width:100%; max-width:480px; height:100dvh; max-height:900px;
    display:flex; flex-direction:column; position:relative;
    background:var(--cream); box-shadow:var(--shadow); overflow:hidden;
  }
  #topbar{ flex:0 0 auto; padding:12px 16px 8px; text-align:center;
    background:linear-gradient(180deg,#fff,rgba(255,255,255,0)); z-index:5; }
  #roomName{font-size:19px; font-weight:800; letter-spacing:-.3px;}
  #roomSub{display:none;}
  #progress{margin-top:7px; height:7px; border-radius:99px; background:#f0e4ec; overflow:hidden;}
  #progressBar{height:100%; width:0%; border-radius:99px;
    background:linear-gradient(90deg,var(--pop),var(--gold)); transition:width .4s;}

  #scene{ flex:1 1 auto; position:relative; margin:6px 12px; border-radius:22px;
    overflow:hidden; box-shadow:inset 0 2px 10px rgba(0,0,0,.06);
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg,#241832,#3a2a4e); }
  /* 사진은 가로를 꽉 채우고, 넘치는 위아래는 잘라낸다(북쑥 선택 2026-08-11).
     크기는 CSS가 아니라 JS(fitScenePhoto)가 픽셀로 정한다 — iOS 사파리가 종횡비를 안 지켜서 좌표가 밀렸다. */
  #photoWrap{ position:relative; overflow:hidden; line-height:0; }
  #photoWrap::after{ content:""; position:absolute; inset:0; z-index:2;
    background:linear-gradient(180deg,rgba(15,8,24,.10),rgba(15,8,24,.36)); pointer-events:none; }
  /* 핫스팟은 사진과 같은 상자 안에 산다 → 좌표 %가 곧 사진 좌표 */
  #photoInner{ position:absolute; left:0; }
  .bgphoto{ display:block; width:100%; height:100%;
    -webkit-user-drag:none; user-select:none; }

  /* 반짝이는 '영역' (테두리 없이, 요소 크기만큼 넓게) */
  .spot-dot{ position:absolute; transform:translate(-50%,-50%); width:17%; height:12%;
    border-radius:18px; cursor:pointer; z-index:3; }
  .spot-dot::before{ content:""; position:absolute; inset:0; border-radius:inherit;
    background:radial-gradient(ellipse at center, rgba(255,255,255,.6), rgba(255,107,157,.32) 46%, rgba(255,107,157,0) 74%);
    animation:breathe 2.4s ease-in-out infinite; }
  .spot-dot::after{ content:""; position:absolute; inset:6%; border-radius:inherit;
    box-shadow:0 0 0 2px rgba(255,255,255,.55); animation:ring 2.4s ease-in-out infinite; }
  .spot-dot.solved::before,.spot-dot.solved::after{ animation:none; opacity:.15; }
  .spot-dot.nohint::before,.spot-dot.nohint::after{ display:none; }  /* ?hint=off : 반짝임 끄고 직접 찾기 (클릭영역은 유지) */
  /* hover 반짝 (PC/데스크톱만 — 모바일 터치엔 영향 없음) */
  @media(hover:hover){ .spot-dot{transition:filter .2s} .spot-dot:hover{filter:brightness(1.4) saturate(1.2)} .spot-dot:hover::before{opacity:1} .hotspot{transition:transform .15s,filter .2s} .hotspot:hover{filter:brightness(1.15)} }
  #photoWrap{transition:transform .13s ease-out}  /* 패럴랙스 부드럽게 */
  @keyframes breathe{ 0%,100%{opacity:.45; transform:scale(.96)} 50%{opacity:1; transform:scale(1.04)} }
  @keyframes ring{ 0%,100%{opacity:.2} 50%{opacity:.75} }

  /* 기존 동그란 이모지 버튼 (아직 사진 안 받은 방) */
  .hotspot{ position:absolute; transform:translate(-50%,-50%);
    display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:3;
    width:56px; height:56px; border-radius:50%; font-size:29px;
    background:rgba(255,255,255,.88); box-shadow:0 4px 12px rgba(0,0,0,.34); transition:transform .15s; }
  .hotspot:active{transform:translate(-50%,-50%) scale(.86);}
  .hotspot.tappable::after{ content:""; position:absolute; inset:-14px; border-radius:50%; animation:pulse 1.8s infinite; }
  @keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(255,107,157,.45);} 70%{box-shadow:0 0 0 16px rgba(255,107,157,0);} 100%{box-shadow:0 0 0 0 rgba(255,107,157,0);} }
  .floaty{animation:floaty 3.5s ease-in-out infinite;}
  @keyframes floaty{0%,100%{translate:0 0}50%{translate:0 -6px}}

  /* 이동 네비게이션 */
  /* 이동 = 싱가포르 여행 방향표지판 (나무판 + 화살표) */
  #navbar{ position:absolute; left:0; right:0; bottom:0; z-index:4;
    display:grid; gap:5px 6px; justify-content:center;
    padding:12px 12px 13px; background:linear-gradient(0deg,rgba(40,20,45,.40),transparent); }
  /* 싱가포르 도로 방향표지판: 파란 바탕 + 흰 테두리 + 흰 글자 (이중 레이어로 화살표 테두리) */
  .navBtn{ cursor:pointer; transition:.12s; background:#fff; padding:2.5px;
    filter:drop-shadow(0 3px 5px rgba(0,0,0,.42));
    clip-path:polygon(0 0, calc(100% - 11px) 0, 100% 50%, calc(100% - 11px) 100%, 0 100%); }
  .navBtn.dl{ clip-path:polygon(11px 0, 100% 0, 100% 100%, 11px 100%, 0 50%); }
  .navBtn .navInner{ display:flex; align-items:center; justify-content:center; gap:2px; min-width:0;
    padding:7px 13px 7px 8px; font-size:10px; font-weight:800; line-height:1.15; white-space:nowrap; overflow:hidden;
    background:linear-gradient(180deg,#1a72c9,#12518f); color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.35);
    clip-path:polygon(0 0, calc(100% - 11px) 0, 100% 50%, calc(100% - 11px) 100%, 0 100%); }
  .navBtn.dl .navInner{ padding:7px 8px 7px 13px; clip-path:polygon(11px 0, 100% 0, 100% 100%, 11px 100%, 0 50%); }
  .navBtn:active{ transform:scale(.95); }
  .navBtn.locked .navInner{ background:linear-gradient(180deg,#8f9bad,#6b788a); }
  .navBtn .nbl{ overflow:hidden; text-overflow:ellipsis; }
  .navBtn svg{ width:15px; height:15px; flex:0 0 auto; }

  /* 인벤토리 */
  /* z-index 29 = 클로즈업 팝업(28)보다 위 → 팝업 열려도 가방이 밝게 보이고 선택 가능 */
  #invWrap{flex:0 0 auto; padding:8px 12px 14px; position:relative; z-index:29;}
  /* 팝업 열렸을 때 가방이 어두운 배경 위에 떠 보이도록 살짝 강조 */
  #app.cuOpen #invWrap #inventory{ box-shadow:0 0 0 2px rgba(255,255,255,.25), 0 -6px 22px rgba(0,0,0,.45); }
  #app.cuOpen #invLabel{ color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.6); }
  #invLabel{font-size:11px; color:#b3a4bd; margin:0 4px 5px; font-weight:700;}
  #inventory{ display:flex; gap:8px; overflow-x:auto; padding:7px 8px 20px; min-height:70px;
    background:#fff; border-radius:16px; box-shadow:var(--shadow); }
  .invItem{ flex:0 0 auto; width:42px; height:42px; border-radius:11px;
    background:linear-gradient(160deg,#fff,#fdeef5);
    display:flex; align-items:center; justify-content:center; font-size:22px;
    border:2px solid transparent; transition:.15s; position:relative; touch-action:manipulation; }
  /* ★사파리 더블탭 확대 방지: 게임 인터랙션 요소 전반 */
  #app, .spot-dot, .hotspot, .navBtn, .btn, .key, .invItem, #closeup, #phone{ touch-action:manipulation; }
  .invItem.sel{border-color:var(--pop); background:#fff0f6; transform:translateY(-3px) scale(1.05);}
  .invItem svg{ width:26px; height:26px; }
  .invItem .nm{position:absolute; bottom:-13px; left:50%; transform:translateX(-50%);
    font-size:8.5px; white-space:nowrap; color:#a294ac;}
  #invEmpty{color:#cbbcd4; font-size:13px; align-self:center; margin:auto; padding:12px;}

  /* 이동 로딩 화면 (이동중...) */
  #transit{ position:absolute; inset:0; z-index:45; display:none; flex-direction:column;
    align-items:center; justify-content:flex-end; background-size:cover; background-position:center; }
  #transitInner{ text-align:center; color:#fff; padding:30px 24px 60px; width:100%;
    background:linear-gradient(0deg,rgba(10,6,18,.82),rgba(10,6,18,0)); }
  #transitText{ font-size:21px; font-weight:800; margin-bottom:16px; text-shadow:0 2px 10px rgba(0,0,0,.8); letter-spacing:-.3px; }
  #transitBarWrap{ width:210px; height:9px; border-radius:99px; background:rgba(255,255,255,.28); overflow:hidden; margin:0 auto; }
  #transitBar{ height:100%; width:0%; background:linear-gradient(90deg,#ff6b9d,#ffd97d); border-radius:99px; }
  #transitSkip{ font-size:12px; color:rgba(255,255,255,.72); margin-top:16px; }
  .transitDots::after{ content:""; animation:dots 1.4s steps(4,end) infinite; }
  @keyframes dots{ 0%{content:""} 25%{content:"."} 50%{content:".."} 75%{content:"..."} 100%{content:""} }

  /* 클로즈업 뷰 (요소 확대) */
  #closeup{ position:absolute; inset:0; z-index:28; background:rgba(12,6,20,.9);
    display:none; flex-direction:column; align-items:center; justify-content:center; padding:20px;
    backdrop-filter:blur(3px); }
  #cuImgWrap{ position:relative; max-width:100%; max-height:56%; }
  /* 손거울 — 벽에 비스듬히 대고 좌우로 끌어 맞춘다 */
  .cu-mirror{ position:absolute; z-index:6; cursor:grab; touch-action:none; }
  .cu-mirror.grabbing{ cursor:grabbing; }
  .cu-mirror.locked{ cursor:default; }
  .mirGlass{ position:absolute; inset:0; overflow:hidden; border-radius:3px; background:#c9d4d8; }
  .mirGlass img{ position:absolute; max-width:none; }
  .mirRefl{ transform:scaleX(-1) scaleY(1.02); transform-origin:center;
    filter:brightness(.94) contrast(.96) saturate(.9); }   /* 유리 너머라 살짝 죽은 색 */
  .mirScr{ pointer-events:none; }
  .mirSheen{ position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(112deg, rgba(255,255,255,.30) 0%, rgba(255,255,255,.05) 26%,
      rgba(255,255,255,0) 46%, rgba(255,255,255,.13) 74%, rgba(255,255,255,.03) 100%); }
  .mirFrame{ position:absolute; inset:-3px; border:3px solid #8d7f6b; border-radius:5px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.25), 0 0 0 1px rgba(0,0,0,.35); pointer-events:none; }
  .cu-mirror.locked .mirFrame{ border-color:#a8925f; }
  .mirGrip{ position:absolute; left:50%; bottom:-30px; transform:translateX(-50%);
    color:#fff; font-size:15px; font-weight:800; letter-spacing:2px; opacity:.72;
    text-shadow:0 2px 6px rgba(0,0,0,.8); pointer-events:none; }
  .cu-mirror.locked .mirGrip{ display:none; }
  /* 거울 아이템 더블탭 팝업 — 유리는 하얗고, 긁힌 자국(모음)만 보인다 */
  .mirGlass.white{ background:#f5f6f6; }
  /* 철문 순서 퍼즐 램프 — 평소엔 안 보이고, 누를 때마다 초록/틀리면 빨강/완성 파랑 */
  .cu-togimg{ position:absolute; transform:translate(-50%,-50%); z-index:4; pointer-events:none; }
  .cu-crcell{ position:absolute; transform:translate(-50%,-50%); z-index:4; cursor:pointer;
    border-radius:8%; border:1px solid rgba(0,0,0,.35);
    box-shadow:inset 0 2px 6px rgba(255,255,255,.35), inset 0 -2px 6px rgba(0,0,0,.3); opacity:.92; }
  .cu-crcell:active{ transform:translate(-50%,-50%) scale(.94); }
  .cu-lamp{ position:absolute; transform:translate(-50%,-50%); border-radius:50%; z-index:5;
    pointer-events:none; opacity:0; transition:opacity .18s ease, box-shadow .18s ease; }
  .cu-lamp.green{ opacity:1; background:radial-gradient(circle, #7dff9a 0%, #2ecc5f 55%, rgba(46,204,95,0) 78%);
    box-shadow:0 0 16px 5px rgba(60,230,110,.7); }
  .cu-lamp.red{ opacity:1; background:radial-gradient(circle, #ff8a8a 0%, #e33333 55%, rgba(238,51,51,0) 78%);
    box-shadow:0 0 16px 5px rgba(255,70,70,.75); }
  .cu-lamp.blue{ opacity:1; background:radial-gradient(circle, #8ad2ff 0%, #2e86ff 55%, rgba(46,134,255,0) 78%);
    box-shadow:0 0 18px 6px rgba(80,150,255,.75); }
  /* 쌍안경 뷰 — 안은 사진, 검은 원 테두리, 바깥은 어둡게.
     원 중심을 살짝 내리고 크게 — 돔의 각인(사진아이콘+숫자)이 밝은 원 안에 들어오게 */
  .cu-binoc{ position:absolute; inset:0; pointer-events:none; z-index:5;
    background:radial-gradient(circle farthest-side at 50% 52%,
      rgba(0,0,0,0) 70%, rgba(0,0,0,.42) 79%, rgba(3,2,6,.97) 88%, #030206 100%); }

  /* 메뉴 아이콘 고르기 (1행 N칸) — 사진 바로 아래, 설명글 위 */
  .pickRow{ display:flex; gap:10px; justify-content:center; margin:12px 0 2px; flex:0 0 auto; }
  .pickCell{ width:66px; height:66px; border-radius:13px; background:#fdfaf6;
    border:2px solid #cbb9a2; box-shadow:0 3px 12px rgba(0,0,0,.32);
    display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .pickLetter{ font-size:34px; font-weight:800; color:#2c2418; letter-spacing:1px;
    font-family:ui-monospace,"SF Mono",Menlo,monospace; line-height:1; }
  .pickColor{ width:46px; height:46px; border-radius:9px; display:block;
    border:2px solid rgba(0,0,0,.28); box-shadow:inset 0 2px 5px rgba(255,255,255,.45); }
  .pickCell svg, .pickCell img{ width:54px; height:54px; object-fit:contain; display:block; -webkit-user-drag:none; }
  .pickCell:active{ transform:scale(.93); }
  .pickCell.pop{ animation:pickPop .22s ease-out; }
  @keyframes pickPop{ 0%{transform:scale(.86)} 60%{transform:scale(1.06)} 100%{transform:scale(1)} }
  @media(prefers-reduced-motion:reduce){ .pickCell.pop{animation:none} }

  /* 벽시계 퍼즐 오버레이 — 바늘만 클릭 가능, 나머지는 사진 그대로 */
  .cu-clock{ position:absolute; left:0; top:0; width:100%; height:100%; z-index:4; pointer-events:none; overflow:visible; }
  .cu-clock .hand{ pointer-events:auto; cursor:pointer; transform-origin:50px 50px;
    transition:transform .22s cubic-bezier(.34,1.32,.5,1); }
  .cu-clock .hand:active{ filter:brightness(1.6); }
  @media(hover:hover){ .cu-clock .hand:hover{ filter:drop-shadow(0 0 2px rgba(255,107,157,.9)); } }
  @media(prefers-reduced-motion:reduce){ .cu-clock .hand{ transition:none; } }
  #cuImg{ max-width:100%; max-height:100%; border-radius:16px; box-shadow:0 16px 46px rgba(0,0,0,.6);
    -webkit-user-drag:none; }
  #cuPlaceholder{ display:none; flex-direction:column; align-items:center; justify-content:center;
    width:270px; height:200px; border-radius:16px; background:rgba(255,255,255,.09);
    border:2px dashed rgba(255,255,255,.42); color:#fff; font-size:46px; gap:12px; }
  #cuPlaceholder span{ font-size:13.5px; color:rgba(255,255,255,.8); font-weight:600; }
  #cuLockBadge{ position:absolute; right:10px; bottom:10px; font-size:34px;
    filter:drop-shadow(0 3px 6px rgba(0,0,0,.6)); animation:floaty 3s ease-in-out infinite; }
  #cuCaption{ color:#fff; margin:16px 6px 4px; text-align:center; font-size:15px; line-height:1.55; white-space:pre-wrap; max-width:360px;}
  #cuActions{ display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; justify-content:center;}
  #cuClose{ position:absolute; top:14px; right:16px; width:38px; height:38px; border-radius:50%;
    background:rgba(255,255,255,.15); color:#fff; border:none; font-size:20px; cursor:pointer; z-index:2;}

  /* 모달 */
  #modalBg{ position:absolute; inset:0; background:rgba(60,40,60,.42);
    display:none; align-items:center; justify-content:center; z-index:30; backdrop-filter:blur(2px); padding:22px; }
  #modal{ width:100%; max-width:340px; background:var(--cream); border-radius:24px;
    padding:22px 20px 20px; box-shadow:0 20px 50px rgba(80,40,70,.35); text-align:center; animation:pop .25s; }
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  #modalEmoji{font-size:52px; line-height:1;}
  #modalTitle{font-size:18px; font-weight:800; margin:10px 0 6px;}
  #modalText{font-size:14px; line-height:1.55; color:#6d5f78; white-space:pre-wrap;}
  #lockInput{ width:100%; font-size:26px; text-align:center; letter-spacing:6px; margin-top:14px;
    padding:12px; border-radius:14px; border:2px solid #f0d9e6; background:#fff; color:var(--ink); font-weight:800; outline:none; }
  .keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px;}
  .key{padding:14px 0; font-size:20px; font-weight:800; border-radius:14px; background:#fff; box-shadow:var(--shadow); cursor:pointer; transition:.1s;}
  .key:active{transform:scale(.92); background:#ffeaf3;}
  .btn{ margin-top:16px; width:100%; padding:14px; border:none; border-radius:16px;
    background:linear-gradient(120deg,var(--pop),#ff9ec4); color:#fff; font-size:16px; font-weight:800; cursor:pointer; box-shadow:var(--shadow); }
  .btn:active{transform:scale(.97);}
  .btn.ghost{background:#fff; color:var(--pop); box-shadow:inset 0 0 0 2px #ffd1e3;}
  .btn.compact{width:auto; margin-top:0; padding:12px 20px;}

  #toast{ position:absolute; left:50%; bottom:150px; transform:translateX(-50%) translateY(20px);
    background:rgba(74,63,85,.94); color:#fff; padding:11px 18px; border-radius:99px;
    font-size:13.5px; font-weight:600; opacity:0; transition:.3s; z-index:40; pointer-events:none; max-width:80%; text-align:center; }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* ★엔딩 GAME CLEAR — 무지개 반짝 글자 + 폭죽 이모지 (북쑥 2026-08-15 "낭낭하게") */
  .gc-title{ font-size:42px; font-weight:900; letter-spacing:1px; line-height:1.1; margin:6px 0 2px;
    font-style:italic; text-shadow:none;
    background:linear-gradient(90deg,#ffd75e,#ff6b9d,#8ec5ff,#7ee0a3,#ffd75e); background-size:300% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:gcShine 2.4s linear infinite, gcPop .8s cubic-bezier(.2,1.7,.4,1) both; }
  @keyframes gcShine{ 0%{background-position:0% 0} 100%{background-position:300% 0} }
  @keyframes gcPop{ 0%{transform:scale(.2) rotate(-6deg); opacity:0} 60%{transform:scale(1.12) rotate(2deg)} 100%{transform:scale(1) rotate(0)} }
  .gcConf{ position:absolute; font-size:27px; pointer-events:none;
    filter:drop-shadow(0 3px 6px rgba(0,0,0,.25)); animation:floaty 3s ease-in-out infinite; }

  /* ★화이트 플래시 — 크리스탈 마법으로 물건이 '뿅' 나올 때 화면 전체가 하얗게 번쩍 (북쑥 2026-08-15) */
  #flash{ position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:80; display:none; }
  #flash.go{ display:block; animation:flashfx .75s ease-out forwards; }
  @keyframes flashfx{ 0%{opacity:0} 10%{opacity:1} 26%{opacity:1} 100%{opacity:0} }
  /* 느린 하얀 페이드 (엔딩 사진 전환) */
  #flash.fade{ display:block; animation:fadefx 1.6s ease-in-out forwards; }
  @keyframes fadefx{ 0%{opacity:0} 34%{opacity:1} 52%{opacity:1} 100%{opacity:0} }
  /* 엔딩 사진 배경일 땐 스토리 어둡기 오버레이 약하게 (밝은 아침 분위기 유지) */
  #story.brightBg::before{ background:rgba(12,22,45,.16); }

<body>

<script>
/* ============================================================
   싱가포르 대탈출 — 클로즈업형 방탈출
   · 방 사진의 '반짝이는 포인트' 클릭 → 요소 확대(클로즈업 사진)

// 열쇠 디자인: 게임엔 다 "열쇠"로 뜨지만 모양(헤드/색)이 달라 사용자가 눈으로 구분. 내부적으로 key1↔자물쇠1 매칭.
const _key = (head,col) => `<svg viewBox="0 0 24 24" fill="none" stroke="${col}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${head}<path d="M9.8 10.3 L18.6 19.1"/><path d="M18.6 19.1 l0 2.4 M15.9 16.4 l1.9 0"/></svg>`;
const ITEMS = {
  key1:{name:"열쇠", svg:_key('<circle cx="7" cy="7" r="4.6"/>','#e0a92e')},                                             // 원형 금색
  key2:{name:"열쇠", svg:_key('<rect x="2.6" y="2.6" width="8.8" height="8.8" rx="1.6"/>','#8f97a6')},                    // 사각 은색
  key3:{name:"열쇠", svg:_key('<path d="M7 11.3C3.4 8.4 3.6 4.6 6.2 4.6c1 0 1.5.6.8.9.7-1.1 1.3-1.9 2.4-1.9 2.6 0 2.8 3.8-.9 6.7z"/>','#ec6f9c')}, // 하트 분홍
  key4:{name:"열쇠", svg:_key('<path d="M7 2.6 L11.4 10.4 L2.6 10.4 Z"/>','#3fb8ae')},                                    // 삼각 청록
  map:{emoji:"🗺️", name:"지도"},
  card:{emoji:"🎟️", name:"교통카드"},
  passport:{name:"내 여권", inspect:"passport",   // ★파란 여권 아이콘(덮힌 얇은 책) + 더블클릭 팝업
    svg:'<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="1.8" fill="#264a90"/><rect x="5" y="3" width="2.4" height="18" rx="1.8" fill="#1b3568"/><rect x="7.1" y="3" width="0.5" height="18" fill="#3a5da3"/><circle cx="13.2" cy="9" r="2.4" fill="none" stroke="#eccb6d" stroke-width="1"/><circle cx="13.2" cy="9" r="0.8" fill="#eccb6d"/><rect x="9.8" y="13.4" width="6.6" height="1.2" rx="0.6" fill="#eccb6d"/><rect x="10.4" y="15.9" width="5.4" height="0.9" rx="0.45" fill="#b4c4e8"/></svg>'},
  // 화랑이의 여권 — 초록 표지. 이비스 체크인용(어디서 얻을지는 북쑥 지시 대기).

/* ---- 사운드 (Web Audio 합성, 파일 불필요) + 햅틱 ---- */
let _actx=null;
function actx(){ if(!_actx){ try{_actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(_actx&&_actx.state==="suspended") _actx.resume(); return _actx; }
function _tone(freq,dur,type,gain,when){ const a=actx(); if(!a)return; const t=when||a.currentTime;
  const o=a.createOscillator(),g=a.createGain(); o.type=type||"sine"; o.frequency.value=freq;
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(gain||.14,t+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+.03); }
function _noise(dur,gain){ const a=actx(); if(!a)return; const t=a.currentTime;
  const b=a.createBuffer(1,Math.max(1,a.sampleRate*dur),a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
  const s=a.createBufferSource(); s.buffer=b; const g=a.createGain(); g.gain.value=gain||.12; s.connect(g); g.connect(a.destination); s.start(t); }
function vib(p){ try{ navigator.vibrate&&navigator.vibrate(p); }catch(e){} }
const SFX={
  tap(){ _tone(430,.05,"triangle",.09); },
  open(){ const t=actx()?.currentTime||0; _tone(520,.09,"sine",.12); _tone(790,.10,"sine",.07,t+.05); },
  key(){ _tone(680,.028,"square",.05); },
  lock(){ _noise(.08,.13); _tone(170,.08,"square",.10); },            // 자물쇠 철컥(열림)
  success(){ const a=actx(); if(!a)return; const t=a.currentTime; [523,659,784,1047].forEach((f,i)=>_tone(f,.3,"sine",.15,t+i*.085)); vib([25,35,55]); },   // (성공 컨페티는 북쑥 지시로 제거 2026-08-15)
  item(){ const a=actx(); if(!a)return; const t=a.currentTime; [784,988,1319].forEach((f,i)=>_tone(f,.17,"triangle",.12,t+i*.05)); vib(28); },
  fail(){ const t=actx()?.currentTime||0; _tone(196,.18,"sawtooth",.13); _tone(150,.22,"sawtooth",.11,t+.06); vib(120); },

};
/* ---- 앰비언스 배경음 (합성 루프: 은은한 웅성+드론) + 음소거 ---- */
let _amb=null, _muted=false;
function startAmbience(){ const a=actx(); if(!a||_amb) return;
  const n=a.sampleRate*2, buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
  let last=0; for(let i=0;i<n;i++){ const w=Math.random()*2-1; last=(last+.02*w)/1.02; d[i]=last*3.2; }
  const src=a.createBufferSource(); src.buffer=buf; src.loop=true;
  const flt=a.createBiquadFilter(); flt.type="lowpass"; flt.frequency.value=480;
  const g=a.createGain(); g.gain.value=0; g.gain.linearRampToValueAtTime(.05,a.currentTime+2.5);
  src.connect(flt); flt.connect(g); g.connect(a.destination); src.start();
  const o1=a.createOscillator(),o2=a.createOscillator(),pg=a.createGain();
  o1.type="sine"; o1.frequency.value=110; o2.type="sine"; o2.frequency.value=164.8;
  pg.gain.value=0; pg.gain.linearRampToValueAtTime(.018,a.currentTime+3.5);
  o1.connect(pg); o2.connect(pg); pg.connect(a.destination); o1.start(); o2.start();
  _amb={g,pg}; }
function toggleMute(){ _muted=!_muted; if(_amb){ _amb.g.gain.value=_muted?0:.05; _amb.pg.gain.value=_muted?0:.018; }
  const b=document.getElementById("muteBtn"); if(b) b.textContent=_muted?"🔇":"🔊"; }

  window.addEventListener("mousemove",e=>apply(e.clientX/innerWidth-.5, e.clientY/innerHeight-.5),{passive:true});

/* ---- ★사진 배치 ----
   핫스팟 좌표는 전부 "사진의 몇 %"다. 그래서 사진과 핫스팟이 같은 상자(#photoInner) 안에 있어야
   좌표가 맞는다. CSS의 max-width/max-height에 맡겼더니 iOS 사파리가 상자를 사진 크기에 맞춰
   줄이지 않아, 아이폰에서만 좌표가 111px 밀렸다(2026-08-11 WebKit으로 재현·확인).
   → 브라우저에 맡기지 않고 픽셀로 직접 정한다.
   가로는 항상 꽉 채우고, 넘치는 위아래는 잘라낸다(북쑥 선택). 세로가 모자라면 위아래 여백이 남는다. */
function fitScenePhoto(){
  const wrap=document.getElementById("photoWrap"); if(!wrap) return;
  const inner=wrap.querySelector("#photoInner"); if(!inner) return;
  const img=inner.querySelector(".bgphoto"); if(!img) return;
  const go=()=>{
    const W=scene.clientWidth, H=scene.clientHeight;
    if(!img.naturalWidth || W<=0 || H<=0) return;
    wrap.style.width=W+"px"; wrap.style.height=H+"px";
    const h = W * img.naturalHeight / img.naturalWidth;      // 가로 기준으로 늘린 사진 높이
    inner.style.width=W+"px"; inner.style.height=h+"px";
    inner.style.top=((H-h)/2)+"px";                          // 넘치면 위아래가 똑같이 잘린다
  };
  go();
  if(!img.complete || !img.naturalWidth) img.addEventListener("load", go, {once:true});
}
/* 팝업 사진(#cuImgWrap)은 건드리지 않는다 — 시계 바늘·상자 버튼 위치가 이미 맞는다(북쑥 확인, 2026-08-11).
   가로로 넓은 사진이라 높이 제한(56%)에 안 걸려서 왜곡이 안 생긴 것으로 보인다. */
/* 화면이 바뀌면(회전·주소창 접힘·창 크기) 다시 맞춘다 */
{ let t=null;
  const refit=()=>{ clearTimeout(t); t=setTimeout(()=>{ fitScenePhoto(); if(mirState&&mirState.layout) mirState.layout(); }, 60); };
  addEventListener("resize", refit);

}

let bgAnimT=null;   // ★맵 배경 애니(머라이언 물줄기 강약) 타이머 — 리렌더/방 이동 시 반드시 정리
function render(){
  const r=MAPS[state.room]; if(!r) return;

  scene.innerHTML="";

  const bg=document.createElement("img"); bg.className="bgphoto"; bg.alt=""; bg.src=r.photo||("img/"+state.room+".jpg");
  inner.appendChild(bg);

  r.hotspots.forEach((h,i)=>{
    const id=state.room+"_"+i;
    if(h.once && state.done[id]) return;
    if(h.showIf && !state.flags[h.showIf]) return;
    if(h.hideIf && state.flags[h.hideIf]) return;   // ★플래그가 서면 사라지는 요소 (예: 열쇠 꽂기 전 홈)

    el.className="spot-dot"+(state.done[id]?" solved":"")+(DEBUG?"":" nohint");
    if(h.w) el.style.width=h.w+"%"; if(h.h) el.style.height=h.h+"%";
    el.title=h.label||"";
    el.onclick=()=>tap(h,id);

  });
  wrap.appendChild(inner);
  scene.appendChild(wrap);
  fitScenePhoto();          // ★사진·핫스팟 상자를 픽셀로 못 박는다 (좌표 % 기준을 맞추려고)

  // ★맵 배경 애니 — 조건 플래그가 서 있으면 frames를 순서대로 반복 (마지막 프레임은 길게)
  { const ba=r.bgAnim;
    if(ba && (!ba.ifFlag || state.flags[ba.ifFlag])){
      let bi=0;
      const step=()=>{
        bg.src=ba.frames[bi];

        bi=(bi+1)%ba.frames.length;
        bgAnimT=setTimeout(step, last?(ba.endHoldMs||ba.ms||1500):(ba.ms||1500));
      };
      step();
    } }

  const nav=document.createElement("div"); nav.id="navbar";
  // showIf 조건 안 맞으면 방향버튼 자체가 안 뜸 (예: 이비스 리셉션 풀기 전엔 '방으로' 숨김)
  const exs=(r.exits||[]).filter(ex=> !ex.showIf || state.flags[ex.showIf]);
  nav.style.gridTemplateColumns=`repeat(${Math.min(exs.length,4)||1}, minmax(0,1fr))`;  // 최대 4열(→2행4열)
  exs.forEach(ex=>{
    const ok = !ex.requireFlags || ex.requireFlags.every(f=>state.flags[f]);
    const b=document.createElement("div"); b.className="navBtn "+(ok?"go":"locked")+" "+(ex.dir==="left"?"dl":"dr");
    const ic = ok ? (ICONS[DEST_ICON[ex.to]]||ICONS.building) : ICONS.lock;
    b.innerHTML = '<div class="navInner">'+ic+'<span class="nbl">'+ex.label+'</span></div>';
    b.onclick=()=>{ ok ? goTo(ex.to) : toast(ex.lockHint||"아직 갈 수 없어."); };
    nav.appendChild(b);
  });
  scene.appendChild(nav);

  renderInv(); save();
}

const TRANSIT_MS = 3000;  // 3초 자동 진행 (북쑥 2026-08-13: 5초 너무 길다) (디버그: 탭 즉시스킵 + 0.9초 자동)
function goTo(to){

  if(key==="ibis>room"||key==="room>ibis"||key==="police>policein"||key==="policein>police"){

    return; }

  if(tr.transit && selected!=="card"){  // 버스·지하철은 교통카드를 골라야 탑승
    if(selected) toast((ITEMS[selected]?.name||"그거")+"로는 대중교통을 탈 수 없어🥲");
    else toast("교통카드를 선택해서 타야 해🥲");

  }
  showTransition(tr, ()=>{ state.room=to; render();

function showTransition(tr, done){

  ov.style.backgroundImage=`linear-gradient(rgba(10,6,18,.30),rgba(10,6,18,.55)), url("${tr.img}")`;
  $("#transitText").innerHTML = tr.icon+" "+tr.text+'<span class="transitDots"></span>';
  bar.style.transition="none"; bar.style.width="0%";
  ov.style.display="flex";
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    bar.style.transition="width "+TRANSIT_MS+"ms linear"; bar.style.width="100%"; }));
  let fin=false; const finish=()=>{ if(fin)return; fin=true; ov.onclick=null; ov.style.display="none"; done(); };
  ov.onclick = DEBUG ? finish : null;             // 디버그: 탭하면 즉시 스킵
  setTimeout(finish, DEBUG ? 900 : TRANSIT_MS);   // ★자동 진행 (일반 5초 / 디버그 0.9초). 디버그도 자동으로 넘어감(버그수정)
}

/* ---- 탭 ---- 모든 요소를 클로즈업(팝업)으로 통일 ---- */
/* ★needSel: 특정 아이템을 '골라 든' 상태여야 통과 (예: 돔=쌍안경, 터널=켜진 손전등)
   {item, flag?, no(미보유), pick(보유+미선택), noFlag(선택했지만 flag 미충족)} — 막히면 토스트+true */
function needSelBlocked(ns){
  if(!ns) return false;
  if(selected!==ns.item){
    toast(has(ns.item) ? (ns.pick||"가방에서 골라서 써봐.") : (ns.no||"이대로는 안 되겠는데."));
    return true;
  }
  if(ns.flag && !state.flags[ns.flag]){ toast(ns.noFlag||"아직 쓸 수 없다."); return true; }
  return false;
}
function tap(h,id){
  SFX.tap(); vib(8);
  if(needSelBlocked(h.needSel)) return;
  // ★gate: 아이템을 전부 가져야 통과하는 문 (예: 유니버설 입장 게이트 = 티켓 2장).
  //   msgs[n] = n개 갖고 있을 때 멘트. 전부 있으면 goTo와 같은 맵 이동(이동연출 포함).
  if(h.gate){
    const g=h.gate, held=(g.items||[]).filter(it=>has(it)).length;
    if(held>=(g.items||[]).length){ goTo(g.to); return; }
    toast((g.msgs&&g.msgs[held])||"아직 들어갈 수 없다."); return;
  }
  // ★goTo: 팝업 없이 즉시 맵 이동 (예: 열린 철문 → 경찰서 안. 이동연출 없음)
  if(h.goTo){ state.room=h.goTo; render(); return; }
  // ★마루(유니버설 인형): 크리스탈 마법 대화 상태머신
  if(h.maru){ maruTalk(); return; }
  const cu = h.closeup || toCloseup(h);
  if(cu.action && cu.action.type==="numlock" && h.needFlag && !state.flags[h.needFlag]){
    toast("먼저 다른 걸 해결해야 할 것 같아."); return; }
  cuStack.length=0;   // 맵에서 새로 여는 팝업은 스택 초기화(중첩 아님)
  openCloseup(cu, h, id);
}
// 이모지형(clue/lock/give) 요소를 클로즈업 형태로 자동 변환. img 없으면 placeholder로 뜸.
function toCloseup(h){

let cuCtx=null, cuAnim=null;

/* ★prize 속 아이템을 전부 챙겼는지 — 챙겼으면 재방문 시 '닫힌 모습+볼일 없다'로 (북쑥 2026-08-13) */
function prizeLooted(a, id){
  const p=a.prize; if(!p) return false;
  if(p.action && p.action.give) return !!state.done[id+"_prize"];          // prize 자체가 give형(벽시계 건전지)
  const loots=(p.subspots||[]).map((s,si)=>({s, sid:id+"_prize_s"+si}))
    .filter(x=> x.s.give || (x.s.closeup && x.s.closeup.action && x.s.closeup.action.give));
  return loots.length>0 && loots.every(x=>state.done[x.sid]);
}
function openCloseup(cu, h, id){

  if(cu.action && cu.action.prize && state.done[id]){
    if(prizeLooted(cu.action, id))
      return openCloseup({img:cu.img, badge:"✅",
        caption:"더 이상 여기에 볼일은 없어 보인다.", action:{type:"clue"}}, h, id+"_looted");
    return openCloseup(cu.action.prize, {label:cu.action.prize.label||""}, id+"_prize");
  }
  if(cu.seenFlag && !state.flags[cu.seenFlag]){ state.flags[cu.seenFlag]=true; save(); }   // ★'봤음' 플래그 (석판 등)
  cuCtx={cu,h,id};
  { const w9=$("#cuImgWrap"); if(w9) w9.style.maxHeight=""; }   // 마루 선택지 등에서 줄인 이미지 높이 원복
  const solved=!!state.done[id];
  const hasImg = cu.img && cu.img!=="TODO";
  const im=$("#cuImg"), ph=$("#cuPlaceholder");
  clearInterval(cuAnim); cuAnim=null;
  if(cu.anim && cu.anim.length){                                   // ★색 변화 애니메이션 (프레임별 시간)
    let ai=0; im.style.display=""; ph.style.display="none";
    let firstCycle=true;                       // 한 바퀴 돌기 전(=처음 안빛나는 이미지)
    const glowMs=cu.animMs||2000;
    const step=()=>{
      im.src="img/closeup/"+cu.anim[ai]+".jpg";
      // ★안빛나는 프레임(anim[0]): 처음 등장은 2초, 글로우 한바퀴 뒤 복귀부턴 4초 (북쑥 요청)
      const ms = (ai===0) ? (firstCycle?2000:4000) : glowMs;
      ai=(ai+1)%cu.anim.length;

    step();

  else if(hasImg){ im.src=cu.img; im.style.display=""; ph.style.display="none"; }
  else { im.removeAttribute("src"); im.style.display="none"; ph.style.display="flex"; }  // 팝업 이미지 준비중
  $("#cuLockBadge").textContent = solved ? "✅" : (cu.badge||"");
  { const cap=$("#cuCaption"); cap.textContent = cu.caption||""; cap.style.display = cu.caption ? "" : "none"; }
  const acts=$("#cuActions"); acts.innerHTML="";
  const a=cu.action||{type:"clue"};
  if(solved){
    // 이미 해결됨
  } else if(a.type==="numlock"){
    const b=document.createElement("button"); b.className="btn compact"; b.textContent="🔢 번호 맞추기";
    b.onclick=()=>openLock(a, ()=>solveCloseup(a));
    acts.appendChild(b);
  } else if(a.type==="keylock"){
    const b=document.createElement("button"); b.className="btn compact"; b.textContent="🔑 열쇠로 열기";
    b.onclick=()=>{
      if(selected===a.needItem){                                                  // 맞는 열쇠를 골랐다
        if(a.consume){ state.inv=state.inv.filter(k=>k!==a.needItem); selected=null; renderInv(); }  // ★쓴 열쇠는 사라짐
        solveCloseup(a);
      }
      else if(selected && selected.indexOf("key")===0) toast("이 열쇠로는 안 열리는데? 🔑");  // 다른 열쇠 선택
      else if(has(a.needItem)) toast("맞는 열쇠를 선택해서 열어봐 🔑");                 // 갖고 있는데 선택 안 함
      else toast(a.noKey||"열쇠가 필요해.");
    };
    acts.appendChild(b);
  } else if(a.type==="checkin"){
    // 이비스 체크인 — 두 여권(내 여권+화랑이의 여권)을 모두 가져야 통과
    const cb=document.createElement("button"); cb.className="btn compact"; cb.textContent="🛎️ 체크인하기";
    cb.onclick=()=>{
      if(has("passport") && has("passport2")) solveCloseup(a);
      else toast(a.no||"두 분의 여권이 모두 필요합니다.");
    };
    acts.appendChild(cb);
  } else if(a.type==="give"){
    const b=document.createElement("button"); b.className="btn compact"; b.textContent="가져가기";
    b.onclick=()=>solveCloseup(a);
    acts.appendChild(b);
  }
  // ★벽시계 퍼즐: 사진 위에 바늘을 얹는다 (버튼 없음 — 바늘을 직접 누른다)
  { const w0=$("#cuImgWrap"); if(w0) w0.querySelectorAll(".cu-clock").forEach(e=>e.remove()); }
  if(a.type==="clock") buildClock(a, id);
  // ★메뉴 아이콘 고르기: 사진 아래에 빈칸 N개 (다른 팝업으로 넘어가면 반드시 지운다)
  // 풀린 뒤에도 정답이 잠긴 채 보이게 buildPicker는 항상 호출 (내부에서 solved면 조작 잠금)
  clearPicker();
  if(a.type==="picker") buildPicker(a, id);
  // ★거울 대기: 사진 위에 끌 수 있는 손거울
  clearMirror();
  if(a.type==="mirror") buildMirror(a, id);
  else if(a.type==="mirrorview") buildMirrorView(a);   // 거울 아이템 더블탭 팝업(고정·하얀 유리)
  // ★순서 누르기(철문): 동물 클릭영역 + 램프
  clearSeq();
  if(a.type==="seq") buildSeq(a, id);
  // ★12칸 토글(마리나 정비함): 블록 누르면 들어가고/나오고, 패턴 일치 순간 통과
  clearToggle();
  if(a.type==="toggle") buildToggle(a, id);
  // ★닦기(비보시티 쇼윈도): 손수건 골라 들고 문지르면 먼지가 지워진다
  clearWipe();
  if(a.type==="wipe") buildWipe(a, id);
  // ★색판 로테이션(라우파삿 과일 상자): 빈 나무판 위 색 오버레이, 탭마다 색 순환
  clearCrotate();
  if(a.type==="crotate") buildCrotate(a, id);
  // ★쌍안경 뷰: 검은 원 테두리 오버레이 (바깥 어둡고 안은 사진)
  { const w0=$("#cuImgWrap");
    if(w0){ w0.querySelectorAll(".cu-binoc").forEach(e=>e.remove());
      if(cu.binoc){ const v=document.createElement("div"); v.className="cu-binoc"; w0.appendChild(v); } } }
  // ★팝업 속 서브 핫스팟(사진 위 클릭영역 → 중첩 팝업). 맵 요소와 동일한 반짝임영역 방식.
  { const wrap=$("#cuImgWrap");
    if(wrap){
      wrap.querySelectorAll(".cu-subspot").forEach(e=>e.remove());   // 이전 것 제거
      (cu.subspots||[]).forEach((s,si)=>{
        const el=document.createElement("div");
        el.className="spot-dot cu-subspot"+(DEBUG?"":" nohint");
        el.style.left=s.x+"%"; el.style.top=s.y+"%";
        if(s.w) el.style.width=s.w+"%"; if(s.h) el.style.height=s.h+"%";
        el.title=s.label||"";
        el.onclick=(ev)=>{ ev.stopPropagation();
          if(needSelBlocked(s.needSel)) return;                     // ★아이템 골라 들어야 열림
          if(s.goTo){ SFX.tap(); vib(8); closeCloseupAll(); state.room=s.goTo; render(); return; }  // ★사진 눌러 맵 이동
          if(s.tablet){ SFX.tap(); vib(8); openTablet(); return; }  // ★보닛 태블릿 → 잠금해제 팝업
          if(s.give){ const sid=id+"_s"+si;                         // ★클릭 즉시 획득 (팝업 없이)
            if(state.done[sid]){ toast("이미 챙겼어."); return; }
            state.done[sid]=true; give([s.give.item]);
            if(s.give.remove){                                      // ★대신 없어지는 아이템 (예: 손전등)
              state.inv=state.inv.filter(k=>!s.give.remove.includes(k));
              if(s.give.remove.includes(selected)) selected=null;
            }
            if(s.give.setFlag) state.flags[s.give.setFlag]=true;
            SFX.item(); vib([22,32,60]);
            toast(s.give.success||"획득!"); renderInv(); save(); return; }
          if(s.insert){ doInsert(s.insert, id+"_s"+si); return; }   // ★그 자리에서 아이템 끼우기
          SFX.tap(); vib(8); cuStack.push({cu,h,id}); openCloseup(s.closeup, s, id+"_s"+si); };
        wrap.appendChild(el);
      });
    } }
  SFX.open();
  $("#closeup").style.display="flex";
  $("#app").classList.add("cuOpen");   // 가방을 팝업 위로 강조
}
/* ---- 메뉴 아이콘 고르기 퍼즐 (1행 N칸) ----
   빈칸을 누를 때마다 아이콘이 하나씩 바뀐다. N칸이 전부 정답이면 통과.
   아이콘 순서는 송파바쿠테 메뉴간판(3×3)과 같게 맞춰둠 — 간판을 보고 대조할 수 있도록.
   쓰는 법: action:{type:"picker", answer:["rice","veggie","skewer","can"], success:"...", setFlag:"..."}   */
/* ★아이콘 9종 = 북쑥이 준 라인아트 한 장(3×3)을 잘라 쓴다.
   img/icon/*.png — 192px 정사각, 흰 배경은 투명 처리, 각 그림을 칸 정중앙에 정렬해 뒀다.
   (내가 직접 그린 SVG 두 판은 알아보기 힘들다고 반려됨) */
const PICK_ICONS=[
  {k:"shrimp", name:"새우튀김", img:"img/icon/shrimp.png"},
  {k:"skewer", name:"꼬치",     img:"img/icon/skewer.png"},
  {k:"egg",    name:"계란조림", img:"img/icon/egg.png"},
  {k:"veggie", name:"공심채",   img:"img/icon/veggie.png"},
  {k:"soup",   name:"갈비탕",   img:"img/icon/soup.png"},
  {k:"rice",   name:"볶음밥",   img:"img/icon/rice.png"},
  {k:"noodle", name:"국수",     img:"img/icon/noodle.png"},
  {k:"can",    name:"캔음료",   img:"img/icon/can.png"},
  {k:"teapot", name:"주전자",   img:"img/icon/teapot.png"},
];
PICK_ICONS.forEach(o=>{ const im=new Image(); im.src=o.img; });   // 토글할 때 깜빡이지 않게 미리 받아둔다
const PICK_BLANK=`<svg viewBox="0 0 48 48"><path fill="none" stroke="#141414" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4.5" d="M9 9h30v30H9z"/></svg>`;

/* ★보기 묶음 — action.set 으로 고른다 (없으면 음식 아이콘)
   food : 빈칸에서 시작해 한 번 누를 때마다 아이콘이 바뀐다
   alpha: A로 시작해 알파벳 12자를 순서대로 돈다 (정답에 쓰는 A·S·G·P·R 포함)
   digit: 0000에서 시작해 누를 때마다 1씩 증가(9 다음 0) — 아랍 카페 4자리 */
const ALPHA_KEYS = "ADEGKLMNPRST".split("");
const GOTY_KEYS = "BGEOATSY".split("");   // 8글자 순환 — 정답 GOTY(거울 벽 퍼즐의 답)
const DIGIT_KEYS = "0123456789".split("");
// 꼬치 5종 아이콘 — 북쑥 라인아트 한 장(1408×768)을 5개로 잘라 투명화 (2026-08-14, 글자 → 그림 교체)
const MTEN_KEYS = "EHIKLNOSVY".split("");   // 모스표 10글자와 동일 세트 — 경찰서 모스 상자(정답 LOVE)
const CPANEL_COLORS = [   // 라우파삿 과일 상자 색판 — 로테이션 빨→주→노→초→파랑→하늘, 정답 하·파·빨·주(경찰서 무지개 창 ①②③④)
  {k:"빨", c:"#e03131"},
  {k:"주", c:"#f7862c"},
  {k:"노", c:"#ffd43b"},
  {k:"초", c:"#37b24d"},
  {k:"파", c:"#1b3fc0"},   // (북쑥 2026-08-15: 더 찐한 남색 수준으로)
  {k:"하", c:"#6fd0ff"},
];
const SKEWER_ICONS = [
  {k:"새우", img:"img/icon/sk_shrimp.png"},
  {k:"은행", img:"img/icon/sk_ginkgo.png"},
  {k:"파",   img:"img/icon/sk_leek.png"},
  {k:"소",   img:"img/icon/sk_beef.png"},
  {k:"닭",   img:"img/icon/sk_chicken.png"},
];   // 로테이션 순서(북쑥 지정). 정답은 그릴 사진 순서 = 새우 파 은행 소 닭
const PICK_SETS = {
  food : { keys: PICK_ICONS.map(o=>o.k), start:-1,
           html: i => i<0 ? PICK_BLANK
                          : `<img src="${PICK_ICONS[i].img}" alt="${PICK_ICONS[i].name}" draggable="false">` },
  skewer:{ keys: SKEWER_ICONS.map(o=>o.k), start:0,
           html: i => `<img src="${SKEWER_ICONS[i].img}" alt="${SKEWER_ICONS[i].k}" draggable="false">` },
  mten : { keys: MTEN_KEYS, start:0,
           html: i => `<span class="pickLetter">${MTEN_KEYS[i]}</span>` },
  cpanel:{ keys: CPANEL_COLORS.map(o=>o.k), start:0,
           html: i => `<span class="pickColor" style="background:${CPANEL_COLORS[i].c}"></span>` },
  alpha: { keys: ALPHA_KEYS, start:0,
           html: i => `<span class="pickLetter">${ALPHA_KEYS[i]}</span>` },
  digit: { keys: DIGIT_KEYS, start:0,
           html: i => `<span class="pickLetter">${DIGIT_KEYS[i]}</span>` },
  goty : { keys: GOTY_KEYS, start:0,
           html: i => `<span class="pickLetter">${GOTY_KEYS[i]}</span>` },
};
const pickSet = a => PICK_SETS[a.set] || PICK_SETS.food;

/* ---- 거울 대기 퍼즐 ----
   벽에는 글자가 세로 중심선 왼쪽만 칠해져 있다. 손거울을 그 선에 맞춰 세우면
   반쪽이 거울에 비쳐 글자가 완성되고, 거울에 난 긁힌 자국이 반사만으로는 안 생기는
   획(ㅣ·ㅏ·ㅣ)을 채워준다. 거울은 정면이 아니라 살짝 눕혀 대는 것처럼 기울여 뒀다.
   거울은 벽에 정면으로 댄다 — 기울여 봤더니 글자가 어긋나 보여서 북쑥이 정면을 택했다.
   쓰는 법: action:{type:"mirror", needItem:"mirror", targetX:48.9, tol:2.6, scratch:"...", ...} */
let mirState=null;
function clearMirror(){ if(mirState&&mirState.ro) mirState.ro.disconnect();
  document.querySelectorAll("#cuImgWrap .cu-mirror").forEach(e=>e.remove()); mirState=null; }
function buildMirror(a, id){
  clearMirror();
  if(a.needItem && selected!==a.needItem) return;  // 가방에서 거울을 골라야 벽에 대볼 수 있다
  const wrap=$("#cuImgWrap"), img=$("#cuImg"); if(!wrap||!img) return;

  const el=document.createElement("div"); el.className="cu-mirror";
  el.innerHTML =
    '<div class="mirGlass">'+
      '<img class="mirRefl" alt="" draggable="false">'+
      (a.scratch ? '<img class="mirScr" alt="" draggable="false" src="'+a.scratch+'">' : '')+
      '<div class="mirSheen"></div>'+
    '</div><div class="mirFrame"></div><div class="mirGrip">↔</div>';
  wrap.appendChild(el);

  const refl=el.querySelector(".mirRefl"), scr=el.querySelector(".mirScr");
  refl.src = img.getAttribute("src");

  // 거울 왼쪽 모서리 위치를 사진 폭의 %로 들고 다닌다
  mirState = { x: (a.startX!=null?a.startX:28), a, id };

  function layout(){
    const iw=img.clientWidth, ih=img.clientHeight;
    if(!iw||!ih) return;
    const mw=Math.round(iw*(a.width||24)/100), mh=Math.round(ih*0.94);
    const mx=Math.round(iw*mirState.x/100), my=Math.round((ih-mh)/2);
    el.style.width=mw+"px"; el.style.height=mh+"px";
    el.style.left=mx+"px"; el.style.top=my+"px";
    // 거울 안쪽: 벽을 좌우 뒤집어 깔면, 거울 왼쪽 모서리를 축으로 반사한 그림이 된다
    refl.style.width=iw+"px"; refl.style.height=ih+"px";
    refl.style.left=(mx-iw)+"px"; refl.style.top=(-my)+"px";
    if(scr){ const anchor=Math.round(iw*a.targetX/100);   // 딱 맞는 자리에서 획이 제자리에 오도록
             scr.style.width=iw+"px"; scr.style.height=ih+"px";
             scr.style.left=(-anchor)+"px"; scr.style.top=(-my)+"px"; }
  }
  mirState.layout=layout;
  layout();
  requestAnimationFrame(layout);                                   // 첫 레이아웃 직후 한 번 더
  if(!img.complete || !img.naturalWidth) img.addEventListener("load", layout, {once:true});
  if(window.ResizeObserver){                                       // 사진 크기가 잡히는 순간 따라간다
    const ro=new ResizeObserver(()=>layout()); ro.observe(img); mirState.ro=ro;
  }

  // ---- 손가락으로 좌우로 끌기 ----
  let dragging=false, grabDX=0;
  const pxToPct = px => px / Math.max(1, img.clientWidth) * 100;
  el.addEventListener("pointerdown", ev=>{
    ev.preventDefault(); ev.stopPropagation();
    dragging=true; try{ el.setPointerCapture(ev.pointerId); }catch(e){} el.classList.add("grabbing");
    grabDX = ev.clientX - el.getBoundingClientRect().left;
  });
  el.addEventListener("pointermove", ev=>{
    if(!dragging) return;
    ev.preventDefault();
    const wrapL = img.getBoundingClientRect().left;
    let nx = pxToPct(ev.clientX - grabDX - wrapL);
    mirState.x = Math.max(a.width||24, Math.min(56, nx));
    layout();
  });
  const drop=ev=>{
    if(!dragging) return;
    dragging=false; el.classList.remove("grabbing");
    try{ el.releasePointerCapture(ev.pointerId); }catch(e){}
    check();
  };
  el.addEventListener("pointerup", drop);
  el.addEventListener("pointercancel", drop);

  // 정답 알림은 일부러 없다 — 맞춰놓고 글자를 읽어서 스스로 알아채는 퍼즐이라
  // "성공!" 을 띄우면 답을 확인시켜 주는 꼴이 된다. 자석처럼 붙여만 준다.
  function check(){
    if(Math.abs(mirState.x - a.targetX) <= (a.tol||2.5)){
      mirState.x = a.targetX; layout();
      SFX.key(); vib(10);
    }
  }
}

/* ---- 거울 아이템 더블탭 팝업 ----
   벽이 아니어도 거울을 들여다볼 수 있다. 유리는 하얗고(비치는 건 없다),
   긁힌 자국(ㅣ·ㅏ·ㅣ)만 벽에서 보던 그대로 남아 있다. 끌기 없음·고정.
   scratch 좌표계는 벽 퍼즐과 동일: 유리에 보이는 창 = [targetX, targetX+width]% */
function buildMirrorView(a){
  clearMirror();
  const wrap=$("#cuImgWrap"), img=$("#cuImg"); if(!wrap||!img) return;
  const el=document.createElement("div"); el.className="cu-mirror locked";
  el.innerHTML =
    '<div class="mirGlass white">'+
      (a.scratch ? '<img class="mirScr" alt="" draggable="false" src="'+a.scratch+'">' : '')+
      '<div class="mirSheen"></div>'+
    '</div><div class="mirFrame"></div>';
  wrap.appendChild(el);
  const scr=el.querySelector(".mirScr");
  const W=a.width||24;
  mirState={ x:50-W/2, a, id:"item_mirror" };   // 가운데 고정
  function layout(){
    const iw=img.clientWidth, ih=img.clientHeight;
    if(!iw||!ih) return;
    const mw=Math.round(iw*W/100), mh=Math.round(ih*0.94);
    const mx=Math.round(iw*mirState.x/100), my=Math.round((ih-mh)/2);
    el.style.width=mw+"px"; el.style.height=mh+"px";
    el.style.left=mx+"px"; el.style.top=my+"px";
    if(scr){ const anchor=Math.round(iw*a.targetX/100);
             scr.style.width=iw+"px"; scr.style.height=ih+"px";
             scr.style.left=(-anchor)+"px"; scr.style.top=(-my)+"px"; }
  }
  mirState.layout=layout;
  layout();
  requestAnimationFrame(layout);
  if(!img.complete || !img.naturalWidth) img.addEventListener("load", layout, {once:true});
  if(window.ResizeObserver){
    const ro=new ResizeObserver(()=>layout()); ro.observe(img); mirState.ro=ro;
  }
}

/* ---- 순서 누르기 퍼즐 (경찰서 철문) ----
   동물을 정답 순서대로 누른다. 맞을 때마다 램프가 왼쪽부터 초록으로 켜지고,
   틀리면 전부 빨갛게 번쩍인 뒤 꺼지며 처음부터. 다 맞으면 파랗게 빛나며 달칵.
   쓰는 법: action:{type:"seq", answer:["sparrow",...], zones:[{k,x,y,w,h,label}],
            lamps:[{x,y}], lampW, lampH, success, setFlag} */
/* ---- 닦기 퍼즐 (비보시티 쇼윈도) ----
   closeup.img = 깨끗한 사진(1461). 그 위 캔버스에 더러운 사진(a.dirty)을 그려 두고,
   손수건(a.needItem)을 골라 든 채 문지르면 destination-out 브러시로 지워진다.
   threshold(기본 0.68) 이상 지우면 완료 — 남은 먼지는 서서히 사라짐.
   쓰는 법: action:{type:"wipe", dirty:"img/...", needItem:"hankie", no, pick, doneMsg, setFlag} */
let wipeCtx=null;
function clearWipe(){ const c=document.querySelector("#cuImgWrap .cu-wipe"); if(c) c.remove(); wipeCtx=null;
  const im=$("#cuImg"); if(im) im.style.visibility=""; }   // (2026-08-15) 아래 숨김 원복
function buildWipe(a, id){
  clearWipe();
  const wrap=$("#cuImgWrap"); if(!wrap) return;
  if(state.done[id]){ $("#cuLockBadge").textContent="✅"; return; }   // 이미 닦음 → 깨끗한 사진만
  // ★깨끗한(정답) 사진이 먼지 캔버스보다 먼저 떠서 잠깐 보이는 문제(북쑥 2026-08-15) →
  //   먼지 캔버스가 그려질 때까지 밑 사진을 숨긴다
  $("#cuImg").style.visibility="hidden";
  const cv=document.createElement("canvas"); cv.className="cu-wipe";
  cv.style.cssText="position:absolute;inset:0;width:100%;height:100%;z-index:6;touch-action:none;cursor:pointer;";
  wrap.appendChild(cv);
  const img=new Image();
  img.onload=function(){
    cv.width=Math.round(img.naturalWidth/2); cv.height=Math.round(img.naturalHeight/2);
    const ctx=cv.getContext("2d");
    ctx.drawImage(img,0,0,cv.width,cv.height);
    wipeCtx={cv,ctx,n:0,warned:false};
    $("#cuImg").style.visibility="";   // 먼지가 덮였으니 밑 사진 복귀
  };
  img.onerror=function(){ $("#cuImg").style.visibility=""; };
  img.src=a.dirty;
  const rub=(ev)=>{
    if(!wipeCtx||state.done[id]) return;
    if(a.needItem && selected!==a.needItem){
      if(!wipeCtx.warned){ wipeCtx.warned=true; setTimeout(()=>{ if(wipeCtx) wipeCtx.warned=false; },1500);
        toast(has(a.needItem)?(a.pick||"가방에서 골라서 닦아봐."):(a.no||"맨손으론 닦이지 않는다…")); }
      return;
    }
    ev.preventDefault();
    const r=cv.getBoundingClientRect();
    const pts=ev.touches?[...ev.touches]:[ev];
    const ctx=wipeCtx.ctx;
    ctx.globalCompositeOperation="destination-out";
    for(const p of pts){
      const x=(p.clientX-r.left)/r.width*cv.width, y=(p.clientY-r.top)/r.height*cv.height;
      const rad=cv.width*0.085;
      const g=ctx.createRadialGradient(x,y,0,x,y,rad);
      g.addColorStop(0,"rgba(0,0,0,1)"); g.addColorStop(0.7,"rgba(0,0,0,0.9)"); g.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,rad,0,7); ctx.fill();
    }
    if(++wipeCtx.n%10===0) checkWipe(a,id);
  };
  cv.addEventListener("pointerdown",(e)=>{ rub(e); });
  cv.addEventListener("pointermove",(e)=>{ if(e.buttons>0||e.pressure>0) rub(e); });
  cv.addEventListener("touchmove",rub,{passive:false});
}
function checkWipe(a,id){
  if(!wipeCtx||state.done[id]) return;
  const cv=wipeCtx.cv, ctx=wipeCtx.ctx;
  let clear=0,total=0;
  try{
    const d=ctx.getImageData(0,0,cv.width,cv.height).data;
    for(let i=3;i<d.length;i+=4*97){ total++; if(d[i]<40) clear++; }
  }catch(e){ return; }
  if(total>0 && clear/total >= (a.threshold||0.68)){
    state.done[id]=true; if(a.setFlag) state.flags[a.setFlag]=true; save();
    SFX.success(); vib([30,40,80]);
    cv.style.transition="opacity 1.2s ease"; cv.style.opacity="0";
    setTimeout(()=>{ clearWipe(); },1300);
    toast(a.doneMsg||"유리가 깨끗해졌다…!");
    $("#cuLockBadge").textContent="✅";
    render();
  }
}

/* ---- 12칸 토글 퍼즐 (마리나 난간 정비함) ----
   블록을 누르면 눌린 모습(marina_press.png 오버레이)으로 들어가고, 다시 누르면 나온다.
   현재 패턴이 answer("1"=눌림)와 일치하는 순간 통과. 순서 없음, 리셋 없음(자유 토글).
   쓰는 법: action:{type:"toggle", answer:"111110010011", sprite, cells:[{x,y}], cellW,cellH, success, setFlag, prize} */
let togState=null;
function clearToggle(){ document.querySelectorAll("#cuImgWrap .cu-togzone, #cuImgWrap .cu-togimg").forEach(e=>e.remove()); togState=null; }

function togTap(i, a, id){

/* ---- 색판 로테이션 퍼즐 (라우파삿 과일 상자) ----
   상자 이미지의 빈 나무판 4칸 위에 색 오버레이를 얹는다. 탭할 때마다 CPANEL_COLORS
   순서(빨→주→노→초→파랑→하늘)로 순환, 시작은 전부 빨강. 4칸이 answer(키 배열)와
   일치하는 순간 통과. 순서 없음, 리셋 없음(자유 순환) — 토글 퍼즐과 같은 규칙.
   쓰는 법: action:{type:"crotate", answer:["하","파","빨","주"], cells:[{x,y}], cellW,cellH, success, setFlag, prize} */
let crState=null;
function clearCrotate(){ document.querySelectorAll("#cuImgWrap .cu-crcell").forEach(e=>e.remove()); crState=null; }
function buildCrotate(a, id){
  clearCrotate();
  const wrap=$("#cuImgWrap"); if(!wrap) return;

function crTap(i, a, id){

let seqState=null;
function clearSeq(){ document.querySelectorAll("#cuImgWrap .cu-seqzone, #cuImgWrap .cu-lamp").forEach(e=>e.remove()); seqState=null; }
// lampColors용: 램프에 임의 색 점등 / 지우기 (인라인 스타일이 클래스보다 우선이라 반드시 지워야 red·blue가 보인다)
function paintLamp(el,c){ el.style.opacity="1";
  el.style.background="radial-gradient(circle, #ffffff 0%, "+c+" 50%, rgba(0,0,0,0) 78%)";
  el.style.boxShadow="0 0 14px 4px "+c; }
function clearLampPaint(el){ el.style.opacity=""; el.style.background=""; el.style.boxShadow=""; }
function buildSeq(a, id){
  clearSeq();
  const wrap=$("#cuImgWrap"); if(!wrap) return;
  const solved=!!state.done[id];
  seqState={ seq:[], lock:false };
  a.lamps.forEach(L=>{

  a.zones.forEach(z=>{

    el.style.width=z.w+"%"; el.style.height=z.h+"%";

    el.onclick=(ev)=>{ ev.stopPropagation(); seqTap(z.k, a, id); };

}
function seqTap(k, a, id){
  // ★판정은 끝에서: 누를 때마다 램프만 초록으로 차오르고(맞든 틀리든),
  //   전부 입력한 뒤에 정답이면 파랑, 틀리면 그때 빨강+리셋 (북쑥 2026-08-13)
  // ★lampColors:true면 초록 대신 '누른 버튼의 색'이 램프에 뜬다 (가든 벽장 — 버튼이 빽빽해 피드백용, 북쑥 2026-08-14)
  if(!seqState || seqState.lock || state.done[id]) return;
  const lamps=[...document.querySelectorAll("#cuImgWrap .cu-lamp")];
  seqState.seq.push(k);
  const li=lamps[seqState.seq.length-1];
  if(li){
    if(a.lampColors){ const z=(a.zones||[]).find(z=>z.k===k); paintLamp(li,(z&&z.color)||"#2ecc5f"); }
    else li.classList.add("green");
  }
  SFX.key(); vib(10);
  if(seqState.seq.length>=a.answer.length){
    seqState.lock=true;
    const okAll = a.answer.every((v,i)=>seqState.seq[i]===v);
    setTimeout(()=>{
      if(okAll){
        lamps.forEach(l=>{ clearLampPaint(l); l.classList.remove("green"); l.classList.add("blue"); });
        SFX.success(); vib([30,40,80]);
        state.done[id]=true; if(a.setFlag) state.flags[a.setFlag]=true; save();
        toast(a.success||"달칵! 문이 열렸다.");
        document.querySelectorAll("#cuImgWrap .cu-seqzone").forEach(e=>e.remove());
        $("#cuLockBadge").textContent="✅";
        render();   // 뒤의 맵 갱신 (hideIf/showIf 요소 반영 — 팝업은 별도 오버레이라 안전)
        // ★prize: 완성 연출 뒤 열린 모습 팝업으로 (문 열림 / 콘솔 뚜껑 → 무전기)
        if(a.prize) setTimeout(()=>openCloseup(a.prize, {label:a.prize.label||""}, id+"_prize"), 900);
      } else {
        if(SFX.fail) SFX.fail(); vib([40,30,40]);
        lamps.forEach(l=>{ clearLampPaint(l); l.classList.remove("green"); l.classList.add("red"); });
        setTimeout(()=>{ lamps.forEach(l=>l.classList.remove("red"));
          seqState.seq=[]; seqState.lock=false; }, 750);
      }
    }, 380);
  }
}

let pickSel=null;   // 각 칸이 고른 보기의 번호 (food는 -1이 빈칸)
function clearPicker(){ document.querySelectorAll("#closeup .pickRow").forEach(e=>e.remove()); }
function buildPicker(a, id){
  clearPicker();
  const wrap=$("#cuImgWrap"); if(!wrap) return;
  const S=pickSet(a);
  const n=(a.answer||[]).length||4;
  const solved=!!state.done[id];
  pickSel = solved ? a.answer.map(k=>S.keys.indexOf(k)) : new Array(n).fill(S.start);
  const row=document.createElement("div"); row.className="pickRow";
  for(let i=0;i<n;i++){
    const c=document.createElement("div"); c.className="pickCell"; c.dataset.i=i;
    c.innerHTML = S.html(pickSel[i]);

  wrap.insertAdjacentElement("afterend", row);   // 사진 바로 아래 · 설명글 위 (사진을 안 가린다)
}
function cyclePick(i, a, id){
  if(state.done[id]) return;
  const S=pickSet(a);
  pickSel[i] = (pickSel[i]+1) % S.keys.length;          // 끝까지 가면 처음으로 돌아온다
  const c=document.querySelector('.pickCell[data-i="'+i+'"]');
  if(c){ c.innerHTML=S.html(pickSel[i]); c.classList.remove("pop"); void c.offsetWidth; c.classList.add("pop"); }
  SFX.key(); vib(6);
  const ok = (a.answer||[]).every((k,j)=> pickSel[j]>=0 && S.keys[pickSel[j]]===k);
  // ★needItem: 이 아이템이 가방에 없으면 정답을 맞춰도 오답처럼 조용히 지나간다
  //   (예: 아랍 GOTY 상자 = 거울 없이 우연히 GOTY를 맞춰도 안 열림 — 북쑥 2026-08-14)
  if(ok && a.needItem && !has(a.needItem)) return;
  if(ok){ state.done[id]=true; setTimeout(()=>solveCloseup(a), 380); }

/* ---- 벽시계 퍼즐 ----
   바늘 하나를 누르면 1칸(30°)씩 돈다. 시침=1시간 / 분침=5분 / 초침=5초 → 셋 다 12칸.
   클릭영역을 바늘마다 다른 반지름 구간에 두어, 바늘이 겹쳐도 원하는 걸 집을 수 있다.
   답은 hotspot의 action에 로마숫자 위치(1~12, 12는 0)로 적는다. */
const CLOCK_NS="http://www.w3.org/2000/svg";
// ★그리는 순서 = 뒤에서 앞으로. 초침이 맨 뒤, 시침이 맨 앞(겹치면 시침이 잡힌다).
// hit=클릭영역 길이(중심부터), hw=클릭영역 굵기 — 손가락으로 집기 좋게 넉넉히.
const CLOCK_HANDS=[
  {k:"s", len:32, w:0.6, col:"#141414", hit:33, hw:13},
  {k:"m", len:24, w:2.0, col:"#141414", hit:25, hw:15},
  {k:"h", len:16, w:2.7, col:"#c62828", hit:17, hw:17},
];
let clockPos=null, clockDeg=null;   // pos=0~11 칸, deg=누적 각도(11→12에서 거꾸로 안 돌게)
function _cel(t,at){ const e=document.createElementNS(CLOCK_NS,t); for(const k in at) e.setAttribute(k,at[k]); return e; }
function _turn(g,deg){ g.style.transform="rotate("+deg+"deg)"; }
function buildClock(a, id){
  const wrap=$("#cuImgWrap"); if(!wrap) return;
  const solved=!!state.done[id];
  clockPos = solved ? {h:a.hour%12, m:a.minute%12, s:a.second%12} : {h:0,m:0,s:0};
  clockDeg = {h:clockPos.h*30, m:clockPos.m*30, s:clockPos.s*30};
  const svg=_cel("svg",{"class":"cu-clock",viewBox:"0 0 100 100"});
  CLOCK_HANDS.forEach(H=>{
    const g=_cel("g",{"class":"hand hand-"+H.k});
    g.appendChild(_cel("line",{x1:50,y1:50,x2:50,y2:50-H.len,stroke:H.col,
      "stroke-width":H.w,"stroke-linecap":"round","pointer-events":"none"}));
    // 투명 손잡이 — pointer-events:stroke 라야 안 보여도 눌린다(기본값 visiblePainted는 투명이면 무시됨)
    g.appendChild(_cel("line",{x1:50,y1:50,x2:50,y2:50-H.hit,
      stroke:"#000","stroke-opacity":"0","stroke-width":H.hw,
      "stroke-linecap":"round","pointer-events":"stroke"}));
    _turn(g, clockDeg[H.k]);
    g.addEventListener("click",ev=>{ ev.stopPropagation(); tickHand(H.k,a,id); });
    svg.appendChild(g);
  });
  // ★중앙 허브: 원본 사진의 가운데(주얼 폭포 로고가 있는 검은 원)만 동그랗게 오려서 바늘 위에 덮는다.
  //   사진이 정확히 중심 50%,50%로 크롭돼 있어서 같은 이미지를 100×100으로 다시 깔면 딱 맞는다.
  const defs=_cel("defs",{});
  const cp=_cel("clipPath",{id:"clkHubClip"});
  cp.appendChild(_cel("circle",{cx:50,cy:50,r:6.3}));
  defs.appendChild(cp); svg.appendChild(defs);
  const hub=_cel("image",{x:0,y:0,width:100,height:100,"clip-path":"url(#clkHubClip)",
    preserveAspectRatio:"none","pointer-events":"none"});
  hub.setAttribute("href", (cuCtx&&cuCtx.cu&&cuCtx.cu.img) || "img/closeup/clock.jpg");
  hub.setAttributeNS("http://www.w3.org/1999/xlink","xlink:href", hub.getAttribute("href"));
  svg.appendChild(hub);
  wrap.appendChild(svg);
}
function tickHand(k, a, id){
  if(state.done[id]) { toast("시계는 이미 맞춰뒀어."); return; }
  clockPos[k]=(clockPos[k]+1)%12;
  clockDeg[k]+=30;                                   // ★누적 — 11칸→12칸에서 거꾸로 안 돈다
  const g=document.querySelector("#cuImgWrap .hand-"+k);
  if(g) _turn(g, clockDeg[k]);
  SFX.key(); vib(6);
  if(clockPos.h===a.hour%12 && clockPos.m===a.minute%12 && clockPos.s===a.second%12){
    state.done[id]=true;
    setTimeout(()=>{
      SFX.lock(); vib([28,40,70]);                       // 딸깍
      if(a.prize) openCloseup(a.prize, {label:"떨어진 것"}, id+"_prize");
    }, 430);
  }
}

/* ---- 아이템 자세히 보기(더블탭): 여권 팝업 / 스마트폰 잠금해제 ---- */

const RADIO_SONG="audio/redred5.wav";

/* ---- 마루(유니버설 분수대 인형) 크리스탈 마법 (북쑥 기획 2026-08-15) ----
   크리스탈 1개 = '특징으로 물건 찾기' 마법 1회. 8특징 전부 사실상 오답 —
   6번째(마지막) 크리스탈을 쓰는 순간엔 무엇을 골라도 화랑이의 여권(passport2)이 나온다.
   한 번 쓴 특징은 회색 비활성(6회 시도/8보기). 사진 = img/closeup/maru_*.jpg
   (지금은 자리표시용 — 북쑥 사진 오면 같은 파일명으로 덮어쓰면 끝). */
const MARU_IMG="img/closeup/universal_chara.jpg";
function whiteFlash(){   // ★마법으로 물건이 '뿅' 나올 때 화면 전체 하얀 번쩍
  const f=$("#flash"); if(!f) return;
  f.classList.remove("go","fade"); void f.offsetWidth;   // 연속 발동 시 애니 재시작
  f.classList.add("go");
  setTimeout(()=>f.classList.remove("go"), 800);
}
/* ★재미요소(2026-08-15): 퍼즐 성공 순간 이모지 폭죽 — SFX.success에서 호출. 롤백=이 함수+호출 삭제 */
function confettiBurst(){
  const host=$("#app"); if(!host) return;
  const EMO=["🎉","✨","⭐","💗","🎊"];
  for(let i=0;i<14;i++){
    const e=document.createElement("span"); e.className="confP"; e.textContent=EMO[i%EMO.length];
    const ang=Math.random()*Math.PI*2, dist=90+Math.random()*130;
    e.style.left="50%"; e.style.top="44%";
    e.style.setProperty("--dx",(Math.cos(ang)*dist)+"px");
    e.style.setProperty("--dy",(Math.sin(ang)*dist*0.85-46)+"px");
    e.style.animationDelay=(Math.random()*.1)+"s";
    e.style.fontSize=(15+Math.random()*14)+"px";
    host.appendChild(e);
    setTimeout(()=>e.remove(), 1500);
  }
}
function whiteFade(mid){   // ★느린 하얀 페이드인→(정점에서 mid 실행: 배경 교체 등)→아웃 (엔딩 전환용)
  const f=$("#flash"); if(!f){ if(mid)mid(); return; }
  f.classList.remove("go","fade"); void f.offsetWidth;
  f.classList.add("fade");
  setTimeout(()=>{ if(mid)mid(); }, 600);
  setTimeout(()=>f.classList.remove("fade"), 1650);
}

const CRYSTAL_KEYS=["crystal","crystal2","crystal3","crystal4","crystal5","crystal6"];

function maruState(){ if(!state.maru) state.maru={used:[],given:0}; return state.maru; }
function maruCrystals(){ return state.inv.filter(k=>CRYSTAL_KEYS.includes(k)).length; }
function maruOpen(img, caption, btns){   // openCloseup 후 버튼 주입 (done 마킹 안 하는 id 사용)

function maruChoice(){
  const st=maruState();
  maruOpen(MARU_IMG,
    "🧸 \"그래서 — 원하는 물건은\n어떤 특징을 가졌어?\"\n(가진 크리스탈 💎 "+maruCrystals()+"개)", []);
  $("#cuImgWrap").style.maxHeight="30%";   // 보기 8개가 가방 위로 다 보이게 이미지 축소

    b.textContent=f.label;

function maruPick(f){
  const st=maruState();
  if(maruCrystals()<=0){ toast("🧸 \"특별한 힘을 가진 크리스탈이 필요해…!\""); return; }
  const key=CRYSTAL_KEYS.find(k=>state.inv.includes(k));   // 크리스탈 1개 소모
  state.inv=state.inv.filter(k=>k!==key); if(selected===key) selected=null;
  st.given++; if(st.used.indexOf(f.k)<0) st.used.push(f.k);
  save(); renderInv();
  if(SFX.item)SFX.item(); vib([15,25,45]);
  if(st.given>=MARU_NEED){ maruSuccess(); return; }
  whiteFlash();   // ★오답 물건이 '뿅' 나오는 순간 화면 번쩍
  maruOpen("img/closeup/"+f.img+".jpg",
    "✨ 뿅! 마루가 "+f.wj+" 찾아왔다!\n🧸 \"자, 원하는 물건이 맞아?\"",
    [{t:"…", fn:()=>maruOpen("img/closeup/"+f.img+".jpg",
      "🧸 \"이게 아니야…? 미안하지만\n새로운 크리스탈로 다른 특징을 골라줘!\"",
      [{t:"다른 특징 고르기", fn:maruChoice}])}]);
}

/* ---- 태블릿 잠금해제 (경찰차 보닛) ----
   6칸 알파벳 주관식, 정답 CORTIS(대소문자 무관 — 자판은 대문자만이라 자동 충족).
   무전기 노래(레드레드=CORTIS)가 힌트. 풀면 지도 앱(3×3 격자+빨간점 5개) 화면. */
let tabVal="";
const TAB_ANS="CORTIS";
function openTablet(){
  if(state.flags.tablet_open){ openTabletMap(); return; }   // 이미 풀렸으면 바로 지도
  tabVal="";
  $("#tabImg").src="img/closeup/tablet_lock.jpg";
  $("#tabMsg").textContent="🔒 태블릿이 잠겨있어";
  renderTabCells(); buildTabKeys();
  SFX.open();
  $("#tab").style.display="flex";
}
function closeTab(){ $("#tab").style.display="none"; }
function openTabletMap(){
  closeTab();
  openCloseup({img:"img/closeup/tablet_map.jpg", badge:"🗺️",
    caption:"🗺️ 지도 앱이 열려 있다.", action:{type:"clue"}}, {label:"태블릿"}, "tablet_map");
}
function renderTabCells(){
  const c=$("#tabCells"); c.innerHTML="";
  for(let i=0;i<TAB_ANS.length;i++){
    const d=document.createElement("div");
    d.className="tcell"+(i===tabVal.length?" blink":"");
    d.textContent=tabVal[i]||"";
    c.appendChild(d);
  }
}
function buildTabKeys(){
  const wrap=$("#tabKeys"); wrap.innerHTML="";
  ["QWERTYUIOP","ASDFGHJKL","ZXCVBNM⌫"].forEach(rowStr=>{
    const row=document.createElement("div"); row.className="tkrow";
    rowStr.split("").forEach(k=>{
      const b=document.createElement("button");
      b.className="tkey"+(k==="⌫"?" tback":""); b.textContent=k;
      b.onclick=()=>tabTap(k);
      row.appendChild(b);
    });
    wrap.appendChild(row);
  });
}
function tabTap(k){
  if(state.flags.tablet_open) return;
  if(k==="⌫"){ tabVal=tabVal.slice(0,-1); renderTabCells(); if(SFX.tap)SFX.tap(); return; }
  if(tabVal.length>=TAB_ANS.length) return;
  tabVal+=k; renderTabCells(); if(SFX.tap)SFX.tap(); vib(6);
  if(tabVal.length===TAB_ANS.length){
    if(tabVal.toUpperCase()===TAB_ANS){
      state.flags.tablet_open=true; save();
      if(SFX.success)SFX.success(); vib([30,40,80]);
      toast("🔓 잠금이 풀렸다!");
      setTimeout(()=>openTabletMap(), 500);
    } else {
      $("#tabMsg").textContent="❌ 아닌 것 같다…";
      if(SFX.fail)SFX.fail(); vib([40,30,40]);
      setTimeout(()=>{ tabVal=""; renderTabCells();
        $("#tabMsg").textContent="🔒 태블릿이 잠겨있어"; }, 900);
    }
  }
}
function buildPhoneKeys(){
  const keys=$("#phoneKeys"); keys.innerHTML="";
  ["1","2","3","4","5","6","7","8","9","A","0","B"].forEach(k=>{
    const b=document.createElement("button"); b.className="pkey"; b.textContent=k;
    b.onclick=()=>phoneTap(k); keys.appendChild(b);
  });
  const bk=document.createElement("button"); bk.className="pkey pback"; bk.textContent="⌫";
  bk.onclick=()=>{ phoneVal=phoneVal.slice(0,-1); $("#phoneInput").textContent=phoneVal; };
  keys.appendChild(bk);
}
function phoneTap(k){
  if(state.flags.phone_unlocked) return;
  if(phoneVal.length>=PHONE_ANS.length) return;
  phoneVal+=k; $("#phoneInput").textContent=phoneVal; if(SFX.tap)SFX.tap(); vib(6);
  if(phoneVal.length===PHONE_ANS.length){
    if(phoneVal===PHONE_ANS){ phoneUnlock(); }
    else {
      $("#phoneLockMsg").textContent="❌ 비밀번호가 틀렸어";
      setTimeout(()=>{ phoneVal=""; $("#phoneInput").textContent=""; $("#phoneLockMsg").textContent="🔒 스마트폰이 잠겨있어"; }, 900);
    }
  }
}
function phoneUnlock(){
  state.flags.phone_unlocked=true; save();
  if(SFX.success)SFX.success();
  toast("🔓 비밀번호가 풀렸어!");   // ★한 번만(잠금해제는 1회)
  $("#phoneImg").src="img/phone_home.jpg";
  $("#phoneScreen").style.display="none";
}
function solveCloseup(a){
  const {id}=cuCtx;
  if(a.give){ give(a.give); SFX.item(); } else SFX.success();
  if(a.setFlag) state.flags[a.setFlag]=true;
  state.done[id]=true;
  // ★prize가 있으면 모달 대신 다음 팝업으로 이어간다(자물쇠 풀고 → 안을 들여다보는 흐름)
  if(a.prize){
    toast(a.success||"열렸다!");
    openCloseup(a.prize, {label:a.prize.label||""}, id+"_prize");
    render(); return;
  }
  closeCloseupAll();
  // ★성공 모달: 폭죽 이모지 대신 '열린 자물쇠' 아이콘 + "잠금 해제!" (북쑥 2026-08-15 — 방탈출 몰입감)
  showModal(UNLOCK_ICON,"잠금 해제!",a.success||"해결했다!");
  render();
}

/* ---- 아이템 끼워넣기 (건전지 → 손전등) ----
   subspot에 insert:{...}를 달면 팝업을 새로 열지 않고 그 자리에서 처리한다. */
function doInsert(ins, id){
  if(selected!==ins.needItem){
    if(has(ins.needItem)) toast(ins.pick||("가방에서 "+((ITEMS[ins.needItem]||{}).name||"아이템")+"을(를) 골라서 넣어봐"));
    else toast(ins.noItem||"뭔가 끼워야 할 것 같은데…");
    SFX.fail(); return;
  }
  if(ins.consume){ state.inv=state.inv.filter(k=>k!==ins.needItem); selected=null; }
  if(ins.setFlag) state.flags[ins.setFlag]=true;
  if(ins.swapItem){ state.inv=state.inv.map(k=>k===ins.swapItem[0]?ins.swapItem[1]:k);
    if(selected===ins.swapItem[0]) selected=null; }   // 맞바꾼 아이템이 선택 중이었으면 선택 해제
  state.done[id]=true;
  SFX.item(); vib([22,32,60]);
  if(ins.next) openCloseup(ins.next, {label:ins.label||""}, id+"_after");
  toast(ins.success||"끼웠다!");
  render();
}

/* ---- 자물쇠 UI (번호 입력) — 콜백 기반 ---- */
let lockCtx=null;
function openLock(lock, onSuccess){ lockCtx={lock, val:"", onSuccess}; drawLock(lock.emoji||"🔒", lock.title||"번호 자물쇠"); }
function openFinalLock(){ openLock({len:FINAL.answer.length, answer:FINAL.answer, hint:FINAL.hint, emoji:"🏩", title:"이비스 버짓 클락키"}, ()=>showEnding()); }
function drawLock(emoji,title){
  const L=lockCtx.lock; const keys=[1,2,3,4,5,6,7,8,9,"←",0,"OK"];
  $("#modal").innerHTML=`
    <div id="modalEmoji">${emoji}</div>
    <div id="modalTitle">${title}</div>
    <div id="modalText">${L.hint||""}</div>
    <input id="lockInput" readonly value="" placeholder="${"•".repeat(L.len)}">
    <div class="keypad">${keys.map(k=>`<div class="key" onclick="lockKey('${k}')">${k}</div>`).join("")}</div>
    <button class="btn ghost" onclick="closeModal()">닫기</button>`;
  $("#modalBg").style.display="flex";
}
function lockKey(k){
  if(!lockCtx) return; const L=lockCtx.lock;
  if(k==="←"||k==="OK") SFX.tap(); else SFX.key();
  if(k==="←") lockCtx.val=lockCtx.val.slice(0,-1);
  else if(k==="OK") return submitLock();
  else if(lockCtx.val.length<L.len) lockCtx.val+=k;
  $("#lockInput").value=lockCtx.val;
  if(lockCtx.val.length===L.len) setTimeout(submitLock,150);
}
function submitLock(){
  if(!lockCtx) return; const L=lockCtx.lock, val=lockCtx.val;
  if(val.length<L.len) return;
  if(val===L.answer || (DEBUG && /^0+$/.test(val))){ /* DEBUG(?debug=1)일 때만 0 통과 */ SFX.lock(); const cb=lockCtx.onSuccess; lockCtx=null; closeModal(); if(cb) cb(); }
  else{
    SFX.fail();
    lockCtx.val=""; const el=$("#lockInput"); if(el){ el.value=""; el.style.borderColor="#ff5a5a";
      el.animate([{transform:"translateX(-6px)"},{transform:"translateX(6px)"},{transform:"translateX(0)"}],{duration:250});
      setTimeout(()=>{ const e2=$("#lockInput"); if(e2) e2.style.borderColor=""; },300); }
    toast("음… 아닌 것 같아. 단서를 다시 봐!");
  }
}

/* ---- 모달 ---- */
/* ★열린 자물쇠 아이콘 (방탈출 성공 모달용 — 폭죽 이모지 대체, 북쑥 2026-08-15) */

  '<rect x="4.2" y="10" width="12.6" height="10.4" rx="2.4" fill="#e6b54c"/>'+
  '<rect x="4.2" y="10" width="12.6" height="3.2" rx="1.6" fill="#f2cd74"/>'+
  '<circle cx="10.5" cy="14.8" r="1.7" fill="#8a6a1a"/>'+
  '<rect x="9.8" y="15.6" width="1.4" height="2.9" rx="0.7" fill="#8a6a1a"/>'+
  '<path d="M20.8 12.6 l.5 1.1 1.1.5 -1.1.5 -.5 1.1 -.5-1.1 -1.1-.5 1.1-.5 Z" fill="#ffd97d"/>'+
  '<path d="M2.4 6.8 l.4.9.9.4 -.9.4 -.4.9 -.4-.9 -.9-.4 .9-.4 Z" fill="#ffd97d"/></svg>';
function showModal(emoji,title,text,btn){
  $("#modal").innerHTML=`
    <div id="modalEmoji">${emoji}</div>
    <div id="modalTitle">${title}</div>
    <div id="modalText">${text}</div>
    <button class="btn" onclick="closeModal()">${btn||"좋아 👍"}</button>`;
  $("#modalBg").style.display="flex";
}
function closeModal(){ $("#modalBg").style.display="none"; lockCtx=null; }
$("#modalBg").addEventListener("click",e=>{ if(e.target.id==="modalBg") closeModal(); });

/* ★뒤로가기 → 크리스탈 (북쑥 C안, 2026-08-14)
   포트캐닝 석판(fc_slab)을 본 뒤 브라우저 '뒤로가기'를 누르면 1회 크리스탈.
   pushState 트랩이라 부수효과로 실수 뒤로가기로 게임에서 튕기는 것도 막아준다. */
try{ history.pushState({taru:1},""); }catch(e){}
window.addEventListener("popstate", function(){
  try{ history.pushState({taru:1},""); }catch(e){}   // 항상 다시 막기 (게임 이탈 방지)
  if(state.flags.fc_slab && !state.flags.back_gem){
    state.flags.back_gem=true;
    if(!state.inv.includes("crystal4")) state.inv.push("crystal4");
    save();
    fadeBlink(function(){ render(); });
    setTimeout(function(){
      SFX.success(); vib([30,40,80]);
      showModal("💎","반짝…","순간, 발밑의 그림자가 반짝였다.\n뒤돌아본 길 위에 크리스탈이 떨어져 있다!","주웠다 💎");
    }, 350);
  }
});
