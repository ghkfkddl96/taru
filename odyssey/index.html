      singles: solvableBySingles(s.puzzle),
      puzzle: s.puzzle.join(""), solution: s.solution.join("")
    };
  };

  function openSudoku(onWin, onBack) {
    var s = sudoku();
    var cur = (G.S.misc.sud && G.S.misc.sud.length === 81) ? G.S.misc.sud.slice() : s.puzzle.slice();
    var sel = -1;
    openFull({
      title: "SUDOKU", right: "",
      build: function (body, foot) {
        var grid = el("div"); grid.id = "sud"; grid.setAttribute("data-t", "sudoku");
        var cells = [];
        for (var i = 0; i < 81; i++) (function (i) {
          var b = el("button", "sc");
          b.setAttribute("data-i", i);
          b.onclick = function () { if (s.puzzle[i]) return; sel = i; paint(); G.sfxTap(); };
          cells.push(b); grid.appendChild(b);
        })(i);
        body.appendChild(grid);
        var pad = el("div"); pad.id = "sudPad";
        for (var n = 1; n <= 9; n++) (function (n) {
          var b = el("button", null, String(n));
          b.setAttribute("data-n", n);
          b.onclick = function () { put(n); };
          pad.appendChild(b);
        })(n);
        var er = el("button", null, "⌫"); er.setAttribute("data-n", "0"); er.onclick = function () { put(0); }; pad.appendChild(er);
        body.appendChild(pad);
        foot.appendChild(dbgSolveBtn(function () { cur = s.solution.slice(); G.S.misc.sud = cur.slice(); G.save(); paint(); setTimeout(onWin, 250); }));
        foot.appendChild(backBtn(onBack));

        function put(n) {
          if (sel < 0 || s.puzzle[sel]) return;
          cur[sel] = n; G.S.misc.sud = cur.slice(); G.save();
          G.sfxTap(); paint();
          if (cur.join("") === s.solution.join("")) {
            G.sfxOk();
            setTimeout(function () { onWin(); }, 500);
          }
        }
        function paint() {
          var sr = sel >= 0 ? (sel / 9) | 0 : -1, scg = sel >= 0 ? sel % 9 : -1;
          for (var i = 0; i < 81; i++) {
            var r = (i / 9) | 0, c = i % 9;
            var cls = "sc";
            if (s.puzzle[i]) cls += " fixed";
            if (i === sel) cls += " sel";
            else if (sel >= 0 && (r === sr || c === scg)) cls += " peer";
            if (c === 2 || c === 5) cls += " br";
            if (r === 2 || r === 5) cls += " bb";
            cells[i].className = cls;
            cells[i].textContent = cur[i] ? String(cur[i]) : "";
          }
        }
        paint();
        window.__sudokuFill = function () {
          cur = s.solution.slice(); G.S.misc.sud = cur.slice(); G.save(); paint();
          setTimeout(function () { onWin(); }, 200);
        };
      }
    });
  }

  /* ═══════════ 광고 전환 연출 ═══════════ */
  function openAd(onGo) {
    openFull({
      title: "", right: "",
      build: function (body, foot) {
        var box = el("div"); box.id = "adBox";
        box.appendChild(el("div", "adTag", "AD"));
        box.appendChild(el("div", null, "🎁 광고를 보면 보상을 받을 수 있어요"));
        var cnt = el("div"); cnt.id = "adCount"; cnt.textContent = "5";
        box.appendChild(cnt);
        var fired = false, t = null;
        function goOnce() { if (fired) return; fired = true; if (t) clearInterval(t); onGo(); }
        var b = el("button", "btn gold", "광고 보고 보상 받기 ▶");
        b.setAttribute("data-t", "adGo");
        b.onclick = goOnce;
        box.appendChild(b);
        body.appendChild(box);
        var n = 5;
        t = setInterval(function () {
          n--; cnt.textContent = String(Math.max(0, n));
          if (n <= 0) { clearInterval(t); goOnce(); }
        }, 1000);
      }
    });
  }

  /* ═══════════ 화살 쏘기 (#21) ═══════════ */
  function openArchery(order, onWin, onBack) {
    var need = order.slice();      // 노래 순서
    var step = 0;
    openFull({
      title: "🏹", right: "",
      build: function (body, foot) {
        var stage = el("div"); stage.id = "arch"; stage.setAttribute("data-t", "archery");
        body.appendChild(stage);
        var msg = el("div"); msg.id = "archMsg"; msg.textContent = "노래가 나온 순서대로 쏴!";
        stage.appendChild(msg);

        /* 과녁: 화면에 아이콘이 붙은 5개 (배치는 섞되 고정 seed) */
        var ids = order.slice();
        var shuffled = ids.slice();
        var r = rng(77) ;
        for (var k = shuffled.length - 1; k > 0; k--) { var j = (r() * (k + 1)) | 0; var t = shuffled[k]; shuffled[k] = shuffled[j]; shuffled[j] = t; }
        var tops = [8, 25, 42, 59, 76];
        var targets = shuffled.map(function (id, i) {
          var d = el("div", "tgt");
          d.style.top = tops[i] + "%";
          d.setAttribute("data-song", id);
          var im = new Image(); im.src = DATA.SONGS[id].icon; d.appendChild(im);
          stage.appendChild(d);
          return { id: id, node: d, top: tops[i], hit: false };
        });

        var ar = el("div"); ar.id = "archer";
        var ai = new Image(); ai.src = DATA.IMG + "archer.jpg"; ar.appendChild(ai);
        ar.style.top = "42%";
        stage.appendChild(ar);
        var ud = el("div", "updown", "↕");
        ud.style.left = "1%"; ud.style.top = "46%";
        stage.appendChild(ud);
        setTimeout(function () { ud.remove(); }, 2600);

        var arrow = el("div"); arrow.id = "arrow"; stage.appendChild(arrow);

        var pos = 42;
        function setPos(p) { pos = Math.max(2, Math.min(80, p)); ar.style.top = pos + "%"; }
        G.drag(ar, {
          move: function (q) {
            var r2 = stage.getBoundingClientRect();
            setPos((q.y - r2.top) / r2.height * 100 - 9);
          }
        });
        G.drag(stage, {
          move: function (q) {
            var r2 = stage.getBoundingClientRect();
            setPos((q.y - r2.top) / r2.height * 100 - 9);
          }
        });

        var firing = false;
        function fire() {
          if (firing) return;
          firing = true;
          G.beep(300, .08, "square", .1);
          arrow.style.display = "block";
          arrow.style.top = (pos + 8) + "%";
          arrow.style.left = "22%";
          var x = 22;
          var iv = setInterval(function () {
            x += 6; arrow.style.left = x + "%";
            if (x >= 76) {
              clearInterval(iv); arrow.style.display = "none"; firing = false;
              resolve();
            }
          }, 16);
        }
        function resolve() {
          /* 화살 높이와 가장 가까운 과녁 */
          var best = null, bd = 1e9;
          targets.forEach(function (t) {
            var d = Math.abs((t.top + 9.5) - (pos + 9));
            if (d < bd) { bd = d; best = t; }
          });
          if (!best || bd > 11) { msg.textContent = "빗나갔다"; G.sfxBad(); return; }
          if (best.id === need[step]) {
            best.hit = true; best.node.classList.add("hit");
            step++;
            G.sfxOk();
            if (step >= need.length) {
              msg.textContent = "명중! 전부 맞췄다";
              setTimeout(onWin, 700);
            } else msg.textContent = step + " / " + need.length;
          } else {
            msg.textContent = "순서가 틀렸어 — 처음부터";
            G.sfxBad(); G.buzz(160);
            step = 0;
            targets.forEach(function (t) { t.hit = false; t.node.classList.remove("hit"); });
          }
        }

        var fb = el("button", "fbtn primary", "🏹 발사");
        fb.setAttribute("data-t", "fire");
        fb.onclick = fire;
        foot.appendChild(fb);
        foot.appendChild(dbgSolveBtn(function () {
          targets.forEach(function (t) { t.hit = true; t.node.classList.add("hit"); });
          step = need.length; msg.textContent = "명중! 전부 맞췄다";
          setTimeout(onWin, 350);
        }));
        foot.appendChild(backBtn(onBack));

        window.__archSolve = function () {
          /* 디버그/검증용: 순서대로 자동 발사 */
          var i = 0;
          (function next() {
            if (i >= need.length) return;
            var t = targets.filter(function (x) { return x.id === need[i]; })[0];
            setPos(t.top - 0.5);
            i++;
            fire();
            setTimeout(next, 900);
          })();
        };
        window.__archTargets = function () { return targets.map(function (t) { return { id: t.id, top: t.top }; }); };
      }
    });
  }

  /* ═══════════ 네모네모로직 (#22) ═══════════ */
  var NONO = [
    ".########.",
    ".########.",
    ".......##.",
    "......##..",
    ".....##...",
    "....##....",
    "...##.....",
    "...##.....",
    "...##.....",
    "...##....."
  ].map(function (r) { return r.split("").map(function (c) { return c === "#" ? 1 : 0; }); });

  function runs(arr) {
    var out = [], n = 0;
    arr.forEach(function (v) { if (v) n++; else { if (n) out.push(n); n = 0; } });
    if (n) out.push(n);
    return out.length ? out : [0];
  }

  function openNono(onWin, onBack) {
    var N = 10;
    var state = (G.S.misc.nono && G.S.misc.nono.length === N * N) ? G.S.misc.nono.slice() : new Array(N * N).fill(0);
    var mode = 1; // 1=칠하기, 2=X
    openFull({
      title: "네모네모로직", right: "",
      build: function (body, foot) {
        var rowH = [], colH = [];
        for (var r = 0; r < N; r++) rowH.push(runs(NONO[r]));
        for (var c = 0; c < N; c++) { var col = []; for (var r2 = 0; r2 < N; r2++) col.push(NONO[r2][c]); colH.push(runs(col)); }

        var wrap = el("div"); wrap.id = "nono";
        var grid = el("div"); grid.id = "nonoGrid"; grid.setAttribute("data-t", "nono");
        var cell = "min(8.2vw, 30px)";
        grid.style.gridTemplateColumns = "min(15vw,54px) repeat(" + N + "," + cell + ")";
        grid.style.gridTemplateRows = "min(13vw,46px) repeat(" + N + "," + cell + ")";
        grid.appendChild(el("div", "nh"));
        for (var c3 = 0; c3 < N; c3++) {
          var h = el("div", "nv");
          colH[c3].forEach(function (n) { h.appendChild(el("span", null, String(n))); });
          grid.appendChild(h);
        }
        var cells = [];
        for (var r3 = 0; r3 < N; r3++) {
          var rh = el("div", "nh");
          rowH[r3].forEach(function (n) { rh.appendChild(el("span", null, String(n))); });
          grid.appendChild(rh);
          for (var c4 = 0; c4 < N; c4++) (function (i) {
            var b = el("button", "nc");
            b.setAttribute("data-i", i);
            b.onclick = function () {
              state[i] = state[i] === mode ? 0 : mode;
              G.S.misc.nono = state.slice(); G.save();
              G.sfxTap(); paint(); check();
            };
            cells[i] = b; grid.appendChild(b);
          })(r3 * N + c4);
        }
        wrap.appendChild(grid);
        body.appendChild(wrap);

        var mb = el("button", "fbtn", "✏️ 칠하기");
        mb.onclick = function () { mode = mode === 1 ? 2 : 1; mb.textContent = mode === 1 ? "✏️ 칠하기" : "✖️ 표시"; };
        foot.appendChild(mb);
        foot.appendChild(dbgSolveBtn(function () {
          for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) state[r * N + c] = NONO[r][c] ? 1 : 0;
          G.S.misc.nono = state.slice(); G.save(); paint(); check();
        }));
        foot.appendChild(backBtn(onBack));

        function paint() {
          for (var i = 0; i < N * N; i++) {
            var cls = "nc";
            if (state[i] === 1) cls += " on";
            if (state[i] === 2) cls += " x";
            if (i % N === 5) cls += " b5";
            if (((i / N) | 0) === 5) cls += " b5r";
            cells[i].className = cls;
            cells[i].textContent = state[i] === 2 ? "✕" : "";
          }
        }
        function check() {
          for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) {
            var want = NONO[r][c], got = state[r * N + c] === 1 ? 1 : 0;
            if (want !== got) return;
          }
          G.sfxOk();
          setTimeout(onWin, 500);
        }
        paint();
        window.__nonoFill = function () {
          for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) state[r * N + c] = NONO[r][c] ? 1 : 0;
          G.S.misc.nono = state.slice(); G.save(); paint(); check();
        };
      }
    });
  }

  window.GAMES = {
    openFull: openFull, closeFull: closeFull, backBtn: backBtn,
    openSudoku: openSudoku, openAd: openAd, openArchery: openArchery, openNono: openNono,
    genSudoku: genSudoku, solveCount: solveCount, solvableBySingles: solvableBySingles, sudoku: sudoku, NONO: NONO
  };
})();

</script>
<script>
/* phone.js — 폰(#4) · 카카오톡(#16 힌트) · QR CODE 앱(#18) · 미니게임 앱(#19~#22) · 구글맵(#11) */
(function () {
  "use strict";
  var el = G.el, clear = G.clear, $ = G.$;

  var view = "lock";

  function open() {
    $("phoneWrap").classList.add("show");
    render();
  }
  function close() {
    stopCam();
    $("phoneWrap").classList.remove("show");
  }
  function go(v) { view = v; render(); }

  function screen() { return clear($("phoneScreen")); }

  /* ★v0.4: 실제 현재 시각(HH:MM), 분마다 갱신 */
  function nowHM() {
    var d = new Date();
    return d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0");
  }
  var clockNodes = [];
  function statusbar() {
    var s = el("div", "pStatus");
    var t = el("div", null, nowHM());
    clockNodes.push(t);
    s.appendChild(t);
    s.appendChild(el("div", null, "5G  100%"));
    return s;
  }
  setInterval(function () {
    var v = nowHM();
    clockNodes = clockNodes.filter(function (n) { return n.isConnected; });
    clockNodes.forEach(function (n) { n.textContent = v; });
  }, 15000);
  function header(title, back) {
    var t = el("div", "pTop");
    var b = el("button", "pBack", "‹");
    b.setAttribute("data-t", "pBack");
    b.onclick = back;
    t.appendChild(b);
    t.appendChild(el("div", null, title));
    return t;
  }

  /* ═══════════ 잠금화면 (#4) ═══════════ */
  function viewLock() {
    var sc = screen();
    sc.appendChild(statusbar());
    var body = el("div", "pBody");
    var box = el("div", "pLock");
    var bigClock = el("div", "clock", nowHM());
    clockNodes.push(bigClock);
    box.appendChild(bigClock);
    box.appendChild(el("div", null, "비밀번호 입력"));
    var dots = el("div", "pDots");
    for (var i = 0; i < 4; i++) dots.appendChild(el("i"));
    box.appendChild(dots);
    var msg = el("div", "lockMsg");
    box.appendChild(msg);
    var keys = el("div", "pKeys");
    var buf = "";
    function paint() {
      Array.prototype.forEach.call(dots.children, function (d, i) { d.className = i < buf.length ? "on" : ""; });
    }
    function press(n) {
      if (buf.length >= 4) return;
      buf += n; G.sfxTap(); paint();
      if (buf.length === 4) {
        var h = G.sha256("odyssey:" + buf);
        if (h === DATA.PIN_HASH) {
          G.sfxOk(); G.setFlag("phoneOpen");
          setTimeout(function () { go("home"); }, 320);
        } else {
          msg.textContent = "틀렸어"; msg.className = "lockMsg bad";
          G.sfxBad(); G.buzz(150);
          buf = ""; setTimeout(function () { paint(); msg.textContent = ""; }, 600);
        }
      }
    }
    "123456789".split("").forEach(function (n) {
      var k = el("button", "pKey", n); k.setAttribute("data-k", n);
      k.onclick = function () { press(n); }; keys.appendChild(k);
    });
    keys.appendChild(el("button", "pKey blank"));
    var z = el("button", "pKey", "0"); z.setAttribute("data-k", "0"); z.onclick = function () { press("0"); }; keys.appendChild(z);
    var bs = el("button", "pKey", "⌫"); bs.onclick = function () { buf = buf.slice(0, -1); paint(); }; keys.appendChild(bs);
    box.appendChild(keys);
    body.appendChild(box);
    sc.appendChild(body);
    window.__phonePress = press;
    /* 디버그 '통과'용 — ★정답 문자열은 절대 노출하지 않는다 */
    window.__lock = {
      answer: "(비공개 · 실제 폰 비번)",
      force: function () { G.setFlag("phoneOpen"); go("home"); }
    };
  }

  /* ═══════════ 홈화면 ═══════════ */
  var mgNode = null;   /* 미니게임 앱 아이콘 노드(설치 애니메이션용) */
  function appIcon(id, label, img, opts) {
    var b = el("button", "pApp" + (opts && opts.locked ? " locked" : ""));
    b.setAttribute("data-t", "app_" + id);
    var ico = el("div", "ico");
    var im = new Image(); im.src = img; ico.appendChild(im);
    if (opts && opts.badge) ico.appendChild(el("div", "badge", opts.badge));
    if (opts && opts.dlBadge) ico.appendChild(el("div", "badge dlb", "\u2193"));
    b.appendChild(ico);
    /* v0.2: 진행바는 아이콘 바로 아래, 아이콘 가로폭만큼 */
    var bar = el("div", "dlbar"); bar.appendChild(el("i"));
    if (!(opts && opts.dl)) bar.style.visibility = "hidden";
    b.appendChild(bar);
    b.appendChild(el("div", "lbl", label));
    b.onclick = function () { G.sfxTap(); opts && opts.onTap && opts.onTap(b); };
    return b;
  }

  function viewHome() {
    var sc = screen();
    sc.appendChild(statusbar());
    var body = el("div", "pBody");
    var apps = el("div", "pApps");
    apps.appendChild(appIcon("kakao", "카카오톡", DATA.IMG + "app_kakao.png", { badge: "1", onTap: function () { go("kakao"); } }));
    apps.appendChild(appIcon("qr", "QR CODE", DATA.IMG + "app_qr.png", { onTap: function () { go("qr"); } }));
    apps.appendChild(appIcon("map", "구글맵", DATA.IMG + "app_map.png", { onTap: function () { go("gmap"); } }));
    var installed = G.flag("mgInstalled");
    mgNode = appIcon("minigame", "미니게임", DATA.IMG + "app_minigame.png", {
      locked: !installed, dlBadge: !installed,
      onTap: function (node) { installed ? MAIN.openMinigame() : askInstall(node); }
    });
    apps.appendChild(mgNode);
    body.appendChild(apps);
    sc.appendChild(body);
  }

  /* ═══════════ 미니게임 앱 설치 (#19) — v0.2: 홈 화면 위 작은 시트 + 아이콘 자리 진행바 ═══════════ */
  function askInstall(node) {
    var sc = $("phoneScreen");
    if (sc.querySelector(".pSheet")) return;
    var sh = el("div", "pSheet");
    sh.appendChild(el("div", "pSheetT", "미니게임 설치"));
    sh.appendChild(el("div", "pSheetD", "설치하려면 비밀번호를 입력하세요"));
    var inp = el("input"); inp.type = "text"; inp.setAttribute("data-t", "mgPass");
    inp.setAttribute("autocapitalize", "off"); inp.setAttribute("autocorrect", "off");
    inp.placeholder = "password"; inp.style.fontSize = "13px";
    sh.appendChild(inp);
    var msg = el("div", "lockMsg"); sh.appendChild(msg);
    var row = el("div", "row");
    var ok = el("button", "btn primary", "설치"); ok.setAttribute("data-t", "mgInstall");
    ok.onclick = function () {
      if (inp.value.trim().toLowerCase() === DATA.ANS.p19) { sh.remove(); runInstall(node); }
      else { msg.textContent = "비밀번호가 달라"; msg.className = "lockMsg bad"; G.sfxBad(); }
    };
    var cc = el("button", "btn ghost", "취소"); cc.onclick = function () { sh.remove(); };
    row.appendChild(ok); row.appendChild(cc);
    sh.appendChild(row);
    sc.appendChild(sh);
    setTimeout(function () { try { inp.focus(); } catch (e) {} }, 60);
  }

  /** 홈 화면은 그대로 두고, 미니게임 아이콘 자리에서만 설치 진행 */
  function runInstall(node) {
    node = node || mgNode;
    if (!node) { G.setFlag("mgInstalled"); go("home"); return; }
    var badge = node.querySelector(".badge");
    if (badge) badge.remove();
    var bar = node.querySelector(".dlbar");
    bar.style.visibility = "visible";
    var fill = bar.querySelector("i");
    var p = 0, T = 2400, t0 = Date.now();
    G.beep(520, 0.06, "sine", 0.07);
    var iv = setInterval(function () {
      p = Math.min(100, (Date.now() - t0) / T * 100);
      fill.style.width = p + "%";
      if (p >= 100) {
        clearInterval(iv);
        G.setFlag("mgInstalled");
        node.classList.remove("locked");
        G.sfxOk();
        setTimeout(function () { bar.style.visibility = "hidden"; go("home"); }, 500);
      }
    }, 60);
  }

  /* ═══════════ 카카오톡 (#16 힌트) ═══════════ */
  function viewKakao() {
    var sc = screen();
    sc.appendChild(statusbar());
    var body = el("div", "pBody");
    body.appendChild(header("김 사원", function () { go("home"); }));
    var room = el("div", "pScroll kkRoom");
    var d = el("div", null, "2026년 8월 27일");
    d.style.cssText = "text-align:center;font-size:10px;color:#8b8d95;margin:2px 0 10px";
    room.appendChild(d);
    var wrap = el("div");
    wrap.appendChild(el("div", "kkFrom", "김 사원"));
    var b = el("div", "kkBubble", DATA.KAKAO_MSG);
    wrap.appendChild(b);
    wrap.appendChild(el("div", "kkTime", "오전 9:12"));
    room.appendChild(wrap);
    body.appendChild(room);
    sc.appendChild(body);
    G.setFlag("kakaoRead");
  }

  /* ═══════════ QR CODE 앱 (#18) ═══════════ */
  var stream = null, scanning = false, scanTimer = null, frozen = false;
  var workCanvas = document.createElement("canvas");
  var workCtx = workCanvas.getContext("2d", { willReadFrequently: true });

  function decodeFrom(src, sw, sh) {
    if (!sw || !sh || typeof window.jsQR !== "function") return null;
    var MAX = 480, scale = Math.min(1, MAX / Math.max(sw, sh));
    var w = Math.max(1, Math.round(sw * scale)), h = Math.max(1, Math.round(sh * scale));
    if (workCanvas.width !== w || workCanvas.height !== h) { workCanvas.width = w; workCanvas.height = h; }
    workCtx.drawImage(src, 0, 0, w, h);
    var img = workCtx.getImageData(0, 0, w, h);
    return window.jsQR(img.data, img.width, img.height, { inversionAttempts: "attemptBoth" });
  }
  function stopCam() {
    scanning = false;
    if (scanTimer) { clearTimeout(scanTimer); scanTimer = null; }
    if (stream) { try { stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {} stream = null; }
  }
  function camErrMsg(e) {
    var n = (e && (e.name || e.code)) || "";
    if (n === "NotAllowedError" || n === "PermissionDeniedError")
      return "카메라 권한이 거부됐어. 사파리 주소창 왼쪽 [ᴀA] → 웹사이트 설정 → 카메라 → '허용' 후 새로고침해줘.";
    if (n === "NotFoundError") return "카메라를 못 찾았어.";
    if (n === "NotReadableError") return "카메라를 다른 앱이 쓰는 중이야.";
    if (n === "SecurityError") return "https 주소에서만 카메라를 쓸 수 있어.";
    return "카메라를 못 켰어 (" + n + ")";
  }

  function viewQR() {
    if (G.flag("p18")) return viewTama();
    var sc = screen();
    sc.appendChild(statusbar());
    var body = el("div", "pBody");
    body.appendChild(header("QR CODE", function () { stopCam(); go("home"); }));
    var inner = el("div");
    inner.style.cssText = "flex:1;display:flex;flex-direction:column;align-items:center;padding:8px;gap:8px;min-height:0";
    var vp = el("div"); vp.id = "qrView";
    var video = el("video");
    video.setAttribute("playsinline", ""); video.setAttribute("muted", ""); video.muted = true;
    vp.appendChild(video);
    vp.appendChild(el("div", "reticle"));
    inner.appendChild(vp);
    var hint = el("div", null, "카메라 켜는 중…");
    hint.style.cssText = "font-size:11px;color:#8b8d95;text-align:center;min-height:26px;padding:0 6px";
    inner.appendChild(hint);
    var manual = el("div");
    manual.style.cssText = "width:100%;padding:0 8px";
    var inp = el("input"); inp.type = "text"; inp.placeholder = "코드 직접 입력";
    inp.setAttribute("data-t", "qrManual");
    inp.setAttribute("autocapitalize", "off"); inp.setAttribute("autocorrect", "off");
    inp.style.fontSize = "12px";
    manual.appendChild(inp);
    var mb = el("button", "btn", "확인"); mb.setAttribute("data-t", "qrSubmit");
    mb.style.cssText = "width:100%;margin:6px 0 0;padding:8px";
    mb.onclick = function () { hit(inp.value.trim()); };
    manual.appendChild(mb);
    inner.appendChild(manual);
    body.appendChild(inner);
    sc.appendChild(body);

    frozen = false;
    function hit(text) {
      if (frozen) return;
      if (!text) return;
      if (text === DATA.TEMP.p18Answer) {
        frozen = true; stopCam();
        vp.classList.add("hit");
        G.sfxOk(); G.buzz([40, 40, 60]);
        hint.textContent = "인식됨 ✓";
        MAIN.prize(DATA.TEMP.p18Prize, "QR 인식 성공!");
        G.setFlag("p18");
        setTimeout(function () { go("qr"); }, 900);   /* → #24 다마고치 화면 */
      } else {
        hint.textContent = "이 코드는 아닌 것 같아";
        G.sfxBad();
      }
    }
    window.__qrHit = hit;

    /* 카메라 시작 — 이 앱을 탭한 시점에 권한 팝업 */
    (async function () {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        hint.textContent = !window.isSecureContext
          ? "https 주소가 아니라 카메라를 못 켜. 아래에 코드를 직접 입력해줘."
          : "이 브라우저는 카메라를 못 써. 사파리로 열거나 코드를 직접 입력해줘.";
        return;
      }
      var tries = [
        { video: { facingMode: { ideal: "environment" } }, audio: false },
        { video: { facingMode: "environment" }, audio: false },
        { video: true, audio: false }
      ];
      var lastErr = null;
      for (var i = 0; i < tries.length; i++) {
        try { stream = await navigator.mediaDevices.getUserMedia(tries[i]); lastErr = null; break; }
        catch (e) { lastErr = e; }
      }
      if (!stream) { hint.textContent = camErrMsg(lastErr) + " 아래에 코드를 직접 입력해도 돼."; return; }
      video.srcObject = stream;
      try { await video.play(); } catch (e) {}
      hint.textContent = "명함의 QR을 비춰줘";
      scanning = true;
      (function tick() {
        if (!scanning) return;
        try {
          if (video.readyState >= 2 && video.videoWidth > 0) {
            var r = decodeFrom(video, video.videoWidth, video.videoHeight);
            if (r && r.data) hit(r.data);
          }
        } catch (e) {}
        scanTimer = setTimeout(tick, 150);
      })();
    })();
  }

  /* ═══════════ #24 다마고치 (★v0.3b 뼈대 — 이미지는 자리표시자) ═══════════ */
  var danceTimer = null;
  function tamaState() {
    if (!G.S.misc.tama) G.S.misc.tama = { state: "hungry" };
    return G.S.misc.tama;
  }
  function viewTama() {
    if (danceTimer) { clearInterval(danceTimer); danceTimer = null; }
    var t = tamaState();
    var sc = screen();
    sc.appendChild(statusbar());
    var body = el("div", "pBody");
    body.appendChild(header("QR CODE", function () { go("home"); }));

    var top = el("div", "tamaTop");
    top.appendChild(el("div", "tamaCode", DATA.TEMP.p18Answer));
    top.appendChild(el("div", "tamaOk", "인식 완료 ✓"));
    body.appendChild(top);

    var stage = el("div", "tamaStage");
    stage.setAttribute("data-t", "tama");
    var room = el("div", "tamaRoom");
    var bubble = el("div", "tamaBubble");
    room.appendChild(bubble);
    var img = new Image(); img.className = "tamaChar";
    room.appendChild(img);
    stage.appendChild(room);
    body.appendChild(stage);
    sc.appendChild(body);

    function setImg(k) { img.src = DATA.TAMA.img[k]; }

    if (t.state === "hungry") {
      bubble.textContent = DATA.TAMA.hungryLine;
      setImg("hungry");
      G.tapper(stage, {
        tap: function () {
          if (G.S.sel === "peanut") { feed(); return; }
          bubble.textContent = DATA.TAMA.hungryLine;
          G.beep(300, .08, "sine", .07);
        }
      });
      var fb = el("button", "btn ghost", "🥜 땅콩 주기");
      fb.setAttribute("data-t", "tamaFeed");
      fb.style.cssText = "margin:6px 10px 10px;font-size:12px;padding:8px 12px";
      fb.onclick = function () {
        if (!G.has("peanut")) { G.toast("땅콩이 없어"); return; }
        feed();
      };
      body.appendChild(fb);
    } else {
      bubble.textContent = DATA.TAMA.happyLine;
      setImg("happy");
      var db = el("button", "btn ghost", "💃 춤춰줘");
      db.setAttribute("data-t", "tamaDance");
      db.style.cssText = "margin:6px 10px 10px;font-size:12px;padding:8px 12px";
      db.onclick = dance;
      body.appendChild(db);
      G.tapper(stage, { tap: dance });
    }

    function feed() {
      if (!G.has("peanut")) { G.toast("땅콩이 없어"); return; }
      G.take("peanut"); G.S.sel = null; MAIN.renderInv();
      t.state = "happy"; G.save();
      G.sfxOk();
      G.toast("땅콩을 줬다!", 1600);
      setTimeout(viewTama, 300);
    }
    function dance() {
      if (danceTimer) return;
      var seq = DATA.TEMP.p24Dance;
      var i = 0;
      bubble.textContent = "🎵";
      setImg("front");
      danceTimer = setInterval(function () {
        if (i >= seq.length) {
          clearInterval(danceTimer); danceTimer = null;
          setImg("happy"); bubble.textContent = DATA.TAMA.happyLine;
          G.setFlag("sawDance");
          return;
        }
        setImg(seq[i] === "L" ? "hipL" : "hipR");
        G.beep(seq[i] === "L" ? 440 : 660, .09, "triangle", .08);
        i++;
      }, DATA.TAMA.danceMs);
    }
    window.__tamaFeed = feed;
    window.__tamaDance = dance;
  }

  /* ═══════════ 구글맵 (#11 · 1차 결말) ═══════════ */
  function viewGmap() {
    var sc = screen();
    sc.appendChild(statusbar());
    var body = el("div", "pBody");
    body.appendChild(header("구글맵", function () { go("home"); }));

    if (!G.flag("gmapOpen")) {
      var box = el("div");
      box.style.cssText = "flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px";
      box.appendChild(el("div", null, "🔒"));
      box.appendChild(el("div", null, "잠긴 앱 — 4자리 비밀번호"));
      /* ★v0.5: 조각 아이템이 색상판으로 대체돼 힌트 출처가 빠짐 → 게임 내 힌트는 "준비 중"
         (정답은 ?debug=1 의 '정답' 표시로만 확인) */
      var frags = el("div", "gmHint", "힌트 준비 중");
      box.appendChild(frags);
      box.appendChild(W.cycleLock({
        id: "p11", n: 4, pool: "0123456789".split(""), size: 10, answer: DATA.ANS.p11,
        onSolve: function () { G.setFlag("gmapOpen"); render(); }
      }));
      body.appendChild(box);
      sc.appendChild(body);
      return;
    }

    /* 지도 + 태풍 접근 */
    var map = el("div");
    map.style.cssText = "flex:1;position:relative;min-height:0";
    var g = el("div"); g.id = "gmap";
    g.innerHTML = '<div class="sea"></div>';
    var l1 = el("div", "land"); l1.style.cssText = "left:-14%;top:-6%;width:60%;height:34%;background:#c6c6cb";
    var l2 = el("div", "land"); l2.style.cssText = "right:-18%;bottom:-8%;width:70%;height:36%;background:#c6c6cb";
    g.appendChild(l1); g.appendChild(l2);
    var route = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    route.setAttribute("viewBox", "0 0 100 100");
    route.setAttribute("preserveAspectRatio", "none");
    route.style.cssText = "position:absolute;inset:0;width:100%;height:100%";
    route.innerHTML = '<path d="M14 12 C 40 34, 58 58, 84 88" fill="none" stroke="#6a6a70" stroke-width="1.4" stroke-dasharray="3 2"/>';
    g.appendChild(route);
    var plane = el("div", null, "✈️"); plane.id = "planeIco";
    var ty = el("div", null, "🌀"); ty.id = "typhoonIco";
    g.appendChild(plane); g.appendChild(ty);
    var cap = el("div", null, "인천 → 덴파사르");
    cap.style.cssText = "position:absolute;left:8px;top:6px;font-size:10px;color:#2a2a2f;background:rgba(255,255,255,.85);border-radius:6px;padding:2px 6px";
    g.appendChild(cap);
    map.appendChild(g);
    body.appendChild(map);
    sc.appendChild(body);

    var t = 0;
    plane.style.left = "42%"; plane.style.top = "44%";
    ty.style.left = "96%"; ty.style.top = "12%";
    var iv = setInterval(function () {
      t += 0.02;
      ty.style.left = (96 - 58 * t) + "%";
      ty.style.top = (12 + 30 * t) + "%";
      if (t >= 1) {
        clearInterval(iv);
        MAIN.ending();
      }
    }, 60);
    window.__gmapSkip = function () { clearInterval(iv); MAIN.ending(); };
  }

  function render() {
    if (view === "lock" && G.flag("phoneOpen")) view = "home";
    if (view !== "qr") stopCam();
    if (view === "lock") viewLock();
    else if (view === "home") viewHome();
    else if (view === "kakao") viewKakao();
    else if (view === "qr") viewQR();
    else if (view === "gmap") viewGmap();
    else viewHome();
  }

  window.PHONE = {
    open: function () { view = G.flag("phoneOpen") ? "home" : "lock"; open(); },
    close: close, go: go, stopCam: stopCam,
    isOpen: function () { return $("phoneWrap").classList.contains("show"); }
  };
})();

</script>
<script>
/* main.js — 씬 렌더 · 인벤 · 클로즈업 · 흐름 · 디버그 */
(function () {
  "use strict";
  var el = G.el, clear = G.clear, $ = G.$, S = G.S;

  /* ═══════════ 공용: 이미지 + 좌표 오버레이 (W.cropView 위임) ═══════════ */
  function imgStage(src, spots, opts) {
    /* spots: [{x,y,w,h,t,onTap,cls}] — 원본 이미지 기준 % */
    var ov = (spots || []).map(function (sp) {
      return { x: sp.x, y: sp.y, w: sp.w, h: sp.h, t: sp.t, cls: "hot " + (sp.cls || ""), onTap: sp.onTap, build: sp.build, onFit: sp.onFit };
    });
    return W.cropView(src, (opts && opts.crop) || null, ov, opts);
  }

  /* ═══════════ 시트(클로즈업/확대) ═══════════ */
  var cuId = null;
  function openCU(id) {
    var f = CU[id];
    if (!f) { G.toast("아직 준비 중"); return; }
    cuId = id;
    W.unregister();
    var sheet = $("closeup");
    $("cuTitle").textContent = "";
    clear($("cuStage")); clear($("cuPanel"));
    $("cuCaption").textContent = "";
    sheet.classList.add("show");
    sheet.setAttribute("data-cu", id);
    if (S.sel && USE[id] && USE[id](S.sel)) { S.sel = null; }
    f({ title: setT, stage: $("cuStage"), panel: $("cuPanel"), cap: setC });
    function setT(t) { $("cuTitle").textContent = t; }
    function setC(t) { $("cuCaption").textContent = t || ""; }
    render();
  }
  function closeCU() {
    cuId = null; W.unregister();
    $("closeup").classList.remove("show");
    clear($("cuStage")); clear($("cuPanel"));
    render();
  }
  function reopenCU() { if (cuId) openCU(cuId); }

  var zoomId = null;
  function openZoom(o) {
    zoomId = o.id || null;
    var z = $("zoom");
    $("zoomTitle").textContent = o.title || "";
    clear($("zoomStage")); clear($("zoomPanel"));
    $("zoomCaption").textContent = o.cap || "";
    if (o.img) { var i = new Image(); i.className = "main"; i.src = o.img; $("zoomStage").appendChild(i); }
    if (o.node) $("zoomStage").appendChild(o.node);
    if (o.panel) $("zoomPanel").appendChild(o.panel);
    z.classList.add("show");
  }
  function closeZoom() { zoomId = null; $("zoom").classList.remove("show"); clear($("zoomStage")); clear($("zoomPanel")); }

  /* ═══════════ 보상 ═══════════ */
  function prize(itemId, msg) {
    if (!itemId) return;
    G.give(itemId);
    var it = DATA.ITEMS[itemId];
    G.toast((msg ? msg + "\n" : "") + "🎁 " + (it ? it.name : itemId) + " 획득!", 2400);
    renderInv();
  }

  /* ═══════════ 씬 ═══════════ */
  function mapImg(m) {
    var src = m.img;
    (m.imgIf || []).forEach(function (p) { if (G.flag(p[0])) src = p[1]; });
    return src;
  }
  function render() {
    var m = DATA.MAPS[S.map];
    if (!m) return;
    $("roomName").textContent = m.name;
    $("mapTag").textContent = m.name;
    var bg = $("sceneBg"), objs = clear($("sceneObjs"));
    if (m.type === "img") {
      bg.style.background = "";
      bg.style.backgroundImage = "url('" + mapImg(m) + "')";
      bg.style.backgroundSize = "cover";
      (m.spots || []).forEach(function (sp) { objs.appendChild(spotNode(sp)); });
    } else {
      bg.style.backgroundImage = "";
      bg.style.background = "radial-gradient(120% 70% at 50% 0%, #26262a 0%, #16161a 58%, #0b0b0c 100%)";
      var floor = el("div", "compFloor"); objs.appendChild(floor);
      (m.objs || []).forEach(function (o) {
        if (o.showIf && !G.flag(o.showIf)) return;
        objs.appendChild(compNode(o));
      });
    }
    $("navL").hidden = !m.left;
    $("navR").hidden = !m.right;
    renderInv();
  }
  function spotNode(sp) {
    var b = el("button", "spot" + (sp.doneIf && G.flag(sp.doneIf) ? " done" : ""));
    b.style.cssText = "left:" + sp.x + "%;top:" + sp.y + "%;width:" + sp.w + "%;height:" + sp.h + "%";
    b.setAttribute("data-t", sp.id);
    b.appendChild(el("div", "ring"));
    b.appendChild(el("div", "lbl", sp.label));
    b.onclick = function () { G.sfxTap(); onSpot(sp); };
    return b;
  }
  function compNode(o) {
    var b = el("button", "spot");
    b.style.cssText = "left:" + o.x + "%;top:" + o.y + "%;width:" + o.w + "%;height:" + o.h + "%";
    b.setAttribute("data-t", o.id);
    var card = el("div", "compObj");
    card.style.cssText = "position:absolute;inset:0";
    if (o.img) { var im = new Image(); im.src = o.img; card.appendChild(im); }
    else { var e = el("div", null, o.emoji || "📦"); e.style.cssText = "width:100%;height:100%;display:grid;place-items:center;font-size:34px"; card.appendChild(e); }
    card.appendChild(el("div", "compName", o.label));
    b.appendChild(card);
    b.appendChild(el("div", "ring"));
    b.onclick = function () { G.sfxTap(); onSpot(o); };
    return b;
  }
  function onSpot(sp) {
    var cu = sp.cu;
    (sp.cuIf || []).forEach(function (p) { if (G.flag(p[0])) cu = p[1]; });
    openCU(cu);
  }

  function goMap(dir) {
    var m = DATA.MAPS[S.map];
    var to = dir === "L" ? m.left : m.right;
    if (!to) return;
    if (to === "window") { openCU("window"); return; }
    S.map = to; G.save(); G.sfxTap(); render();
  }

  /* ═══════════ 인벤 ═══════════ */
  function renderInv() {
    var box = clear($("inventory"));
    if (!S.inv.length) { box.appendChild(el("div", "invEmpty", "비어 있음")); return; }
    S.inv.forEach(function (id) {
      var it = DATA.ITEMS[id] || { name: id, emoji: "❔" };
      var b = el("button", "invItem" + (S.sel === id ? " sel" : ""));
      b.setAttribute("data-t", "inv_" + id);
      if (it.img) { var im = new Image(); im.src = it.img; b.appendChild(im); }
      else if (it.frag) { var f = el("div", null, it.frag[1]); f.style.cssText = "font-size:22px;color:var(--accent);font-weight:700"; b.appendChild(f); }
      else b.appendChild(el("div", null, it.emoji || "❔"));
      b.appendChild(el("div", "nm", it.name.length > 7 ? it.name.slice(0, 7) : it.name));
      G.tapper(b, {
        tap: function () { selectItem(id); },
        dbl: function () { inspect(id); },
        long: function () { inspect(id); }
      });
      box.appendChild(b);
    });
  }
  function selectItem(id) {
    var it = DATA.ITEMS[id];
    if (it && it.action === "phone") { PHONE.open(); return; }
    S.sel = (S.sel === id) ? null : id;
    G.sfxTap();
    renderInv();
    if (S.sel) G.toast(DATA.ITEMS[id].name + " 선택 — 쓸 곳을 눌러봐", 1500);
  }
  function inspect(id) {
    var it = DATA.ITEMS[id];
    if (!it) return;
    if (it.action === "phone") { PHONE.open(); return; }
    if (it.zoom && ZOOM[it.zoom]) { ZOOM[it.zoom](); return; }
    openZoom({ id: id, title: it.name, img: it.img, cap: it.zoomText || "" });
  }
  /* 아이템 사용 시도: 성공하면 true */
  function useItem(target) {
    if (!S.sel) return false;
    var ok = USE[target] && USE[target](S.sel);
    if (ok) { S.sel = null; renderInv(); return true; }
    return false;
  }

  /* ═══════════ 클로즈업 정의 ═══════════ */
  var CU = {};

  /* #2 게이트 */
  CU.gate = function (c) {
    c.title("탑승 게이트");
    var box = el("div");
    box.style.cssText = "text-align:center;font-size:56px";
    box.textContent = "🛫";
    c.stage.appendChild(box);
    c.cap("게이트 앞. 탑승권을 내밀면 된다.");
    var b = el("button", "btn primary", "🎫 탑승권 제출");
    b.setAttribute("data-t", "submitTicket");
    b.onclick = function () {
      closeCU();
      transit("기내로 이동 중…", 1400, function () {
        S.map = "seat"; G.setFlag("boarded"); G.save(); render();
        story(["✈️", "자리에 앉았다.\n창가 좌석, 옆자리는 비어 있다.\n\n…이제 진짜 출발이다."], null);
      });
    };
    c.panel.appendChild(b);
  };

  /* #12 창문 + #23 망원경 */
  CU.window = function (c) {
    c.title("창문");
    if (S.sel === "telescope") {
      c.stage.appendChild(imgStage(DATA.IMG + "window_open.jpg", []));
      c.cap("망원경으로 창밖을 봤다.");
      var t = el("div");
      t.style.cssText = "text-align:center;font-size:13px;color:var(--n8);line-height:1.7";
      t.innerHTML = "🔭 저 멀리 구름 사이로 <b>무언가</b>가 보인다…<br><span style='color:var(--n6);font-size:11px'>(#23 — 보이는 내용 미정, 자리표시자)</span>";
      c.panel.appendChild(t);
      S.sel = null; renderInv();
      G.setFlag("p23seen");
      return;
    }
    var node = W.shade({
      base: DATA.IMG + "window_open.jpg",
      shadeImg: DATA.IMG + "window_shade.jpg",
      closed: G.flag("shadeDown"),
      onClosed: function () {
        if (!G.flag("shadeDown")) { G.setFlag("shadeDown"); G.toast("가리개 무늬에 뭔가 적혀 있다"); }
        c.cap("로고 아래에 이상한 줄이 있다.\nOO 1 2 OO 4 3 …");
      }

  /* #3 / #7 IFE */
  CU.ife = function (c) {
    var F = DATA.IFE;

    /* ── 꺼진 화면: 인디케이터 6개 + 물리 버튼 3개(전부 이미지 위) ── */
    if (!G.flag("ifeOn")) {
      c.title("좌석 화면 (꺼짐)");
      var order = DATA.ANS.p3;
      var got = [], dots = [], locked = false;
      var overlays = [];
      for (var i = 0; i < 6; i++) {
        (function (i) {
          overlays.push({
            x: F.dots.x0 + F.dots.gap * i, y: F.dots.y, w: F.dots.size, h: F.dots.sizeY,
            build: function (n) { n.className = "ifeDot"; n.setAttribute("data-t", "ifeDot" + i); dots[i] = n; }
          });
        })(i);
      }
      F.buttons.forEach(function (bt) {
        overlays.push({
          x: bt.x, y: bt.y, w: bt.w, h: bt.h, t: "ifeb_" + bt.id, cls: "ifeBtn",
          onTap: function () { press(bt.id); }
        });
      });
      c.stage.appendChild(W.cropView(DATA.IMG + "ife_off.jpg", F.crop, overlays, { nw: F.nw, nh: F.nh }));

      function paint() {
        for (var i = 0; i < 6; i++) dots[i].className = "ifeDot" + (i < got.length ? " on" : "");
      }
      function press(id) {
        if (locked || got.length >= 6) return;
        got.push(id);
        G.beep(560, .05, "sine", .08);
        paint();
        if (got.length === 6) {
          locked = true;
          var ok = got.every(function (v, i) { return v === order[i]; });
          if (ok) {
            dots.forEach(function (d) { d.className = "ifeDot ok"; });
            G.sfxOk(); G.setFlag("ifeOn"); G.markSolved("p3");
            setTimeout(function () { reopenCU(); }, 800);
          } else {
            dots.forEach(function (d) { d.className = "ifeDot bad"; });
            G.sfxBad(); G.buzz(140);
            setTimeout(function () { got = []; locked = false; paint(); }, 700);
          }
        }
      }
      paint();
      c.cap("화면 아래 버튼 3개. 순서가 있을 것 같다.");
      W.unregister();
      window.__lock = {
        answer: order.map(function (o) { return DATA.IFE_ICONS[o]; }).join(""),
        force: function () { G.setFlag("ifeOn"); G.markSolved("p3"); reopenCU(); }
      };
      return;
    }

    /* ── 켜진 화면: 메뉴 / TV 둘 다 화면 안에서 ── */
    var view = "menu";
    drawOn();

    function drawOn() {
      clear(c.stage); clear(c.panel);
      c.title("좌석 화면");
      if (view === "menu") return drawMenu();
      return drawTV();
    }

    function drawMenu() {
      var ov = F.tiles.map(function (t) {
        return {
          x: t.x, y: t.y, w: t.w, h: t.h, t: "tile_" + t.id, cls: "ifeTile",
          build: function (n) {
            var box = el("div", "tileIn");
            box.appendChild(el("div", "ti", t.icon));
            box.appendChild(el("div", "tl", t.label));
            n.appendChild(box);
          },
          onTap: function () { t.id === "meal" ? tileMeal() : t.id === "tv" ? (view = "tv", drawOn()) : tileBlanket(); }
        };
      });
      c.stage.appendChild(W.cropView(DATA.IMG + "ife_on.jpg", F.crop, ov, { nw: F.nw, nh: F.nh }));
      c.cap("화면 안 메뉴를 눌러봐.");
    }

    function drawTV() {
      var files = F.slides.files, n = files.length;
      var i = 0, im = null, dotEls = [];
      var ov = [];
      if (F.slides.mode === "full") {
        /* 사진이 IFE 화면에 떠 있는 합성본 — 같은 IFE 프레임으로 보여주고 이미지만 교체 */
        var host = el("div", "imgLockHost");
        var cur = 0;
        function draw() {
          clear(host);
          var back = {
            x: F.back.x, y: F.back.y, w: F.back.w, h: F.back.h, t: "ifeBack", cls: "ifeBack",
            build: function (n2) { var cv = el("div", "cv", "\u2039"); cv._noFit = true; n2.appendChild(cv); },
            onTap: function () { view = "menu"; drawOn(); }
          };
          var swipe = {
            x: F.screen.x, y: F.screen.y, w: F.screen.w, h: F.screen.h, cls: "ifeSwipe", t: "slideNext",
            build: function (n2) {
              var dw = el("div", "ifeDotsBar");
              for (var k = 0; k < files.length; k++) { var dd = el("i"); if (k === cur) dd.className = "on"; dw.appendChild(dd); }
              n2.appendChild(dw);
              var sx = 0;
              G.drag(n2, {
                start: function (q) { sx = q.x; },
                end: function (q) {
                  var dx = q.x - sx;
                  if (dx > 30) go(cur - 1); else go(cur + 1);
                }
              });
            }
          };
          host.appendChild(W.cropView(files[cur], F.crop, [swipe, back], { nw: F.nw, nh: F.nh }));
        }
        function go(k) {
          cur = (k + files.length) % files.length;
          if (cur === files.length - 1) G.setFlag("sawSlides");
          draw();
        }
        c.stage.appendChild(host);
        draw();
        c.cap("좌우로 넘겨봐. 우리가 갔던 곳들이다.");
        return;
      }
      ov.push({
        x: F.screen.x, y: F.screen.y, w: F.screen.w, h: F.screen.h, cls: "ifeScreenOv",
        build: function (n2) {
          n2.className = "ifeScreenOv";
          n2.setAttribute("data-t", "slideNext");
          im = new Image(); n2.appendChild(im);
          var dw = el("div", "ifeDotsBar");
          for (var k = 0; k < n; k++) { var d = el("i"); dotEls.push(d); dw.appendChild(d); }
          n2.appendChild(dw);
          /* 탭=다음, 좌우 스와이프=이전/다음 (drag 하나로 처리 —
             pointerdown 에서 preventDefault 하므로 tapper 와 같이 쓰면 탭이 죽는다) */
          var sx = 0;
          G.drag(n2, {
            start: function (q) { sx = q.x; },
            end: function (q) {
              var dx = q.x - sx;
              if (dx > 30) show(i - 1);
              else if (dx < -30) show(i + 1);
              else show(i + 1);
            }
          });
        }
      });
      ov.push({
        x: F.back.x, y: F.back.y, w: F.back.w, h: F.back.h, t: "ifeBack", cls: "ifeBack",
        build: function (n2) { var cv = el("div", "cv", "\u2039"); cv._noFit = true; n2.appendChild(cv); },
        onTap: function () { view = "menu"; drawOn(); }
      });
      c.stage.appendChild(W.cropView(DATA.IMG + "ife_on.jpg", F.crop, ov, { nw: F.nw, nh: F.nh }));
      c.cap("좌우로 넘겨봐. 우리가 갔던 곳들이다.");
      function show(k) {
        i = (k + n) % n;
        if (im) im.src = files[i];
        dotEls.forEach(function (d, q) { d.className = q === i ? "on" : ""; });
        if (i === n - 1) G.setFlag("sawSlides");
      }
      setTimeout(function () { show(0); }, 40);
      var timer = setInterval(function () {
        if (!$("closeup").classList.contains("show") || view !== "tv") { clearInterval(timer); return; }
        show(i + 1);
      }, 3000);
    }

    function tileMeal() {
      if (G.flag("mealTray")) { G.toast("이미 받았어. 자리 테이블에 있어"); return; }
      G.setFlag("mealTray");
      closeCU();
      story([DATA.IMG + "crew_tray.jpg", "승무원이 기내식을 가져다줬다.\n트레이는 자리 테이블 위에 놓았다."], function () { render(); });
    }
    function tileBlanket() {

        render();

  /* ★v0.5 #25 갤리 간식 수납칸 — 정사각 홈 4개에 색상판을 순서대로 끼운다.
     힌트: 명판 "CHOI. FIRST?" + 왼쪽이 가장 높고 오른쪽으로 낮아지는 막대 4개. */
  CU.snack = function (c) {
    c.title("간식 수납칸");
    if (G.solved("p25")) {
      var got = G.has("peanut") || G.flag("tookPeanut");
      var d0 = el("div", null, "🥫"); d0.style.cssText = "font-size:54px;text-align:center";
      c.stage.appendChild(d0);
      if (!got) {
        var pb = el("button", "btn primary", "땅콩 꺼내기");
        pb.setAttribute("data-t", "openSnack");
        pb.onclick = function () { G.setFlag("tookPeanut"); prize("peanut", ""); reopenCU(); };
        c.panel.appendChild(pb);
        c.cap("안에 땅콩 봉지가 있다.");
      } else c.cap("비어 있다.");
      return;
    }
    var L = DATA.LOCKS.p25;
    var slots = (G.S.misc.p25 && G.S.misc.p25.length === 4) ? G.S.misc.p25.slice() : [null, null, null, null];
    var vnodes = [];

    var overlays = [];
    /* 명판 텍스트 */
    overlays.push({
      x: L.plate.x, y: L.plate.y, w: L.plate.w, h: L.plate.h, cls: "snackPlate",
      build: function (n) { var v = el("div", "cv", L.plateText); n.appendChild(v); }
    });
    /* 힌트 막대 (왼쪽이 가장 높다) */
    L.bars.forEach(function (b2, i) {
      overlays.push({
        x: b2.x, y: b2.y, w: b2.w, h: b2.h, cls: "snackBar",
        build: function (n) { n.setAttribute("data-t", "snackBar" + i); var v = el("div", "cv"); v._noFit = true; n.appendChild(v); }
      });
    });
    /* 정사각 홈 4개 */
    L.cells.forEach(function (cell, i) {
      overlays.push({
        x: cell.x, y: cell.y, w: cell.w, h: cell.h, t: "slot" + i, cls: "snackSlot",
        build: function (n) { var v = el("div", "cv"); v._noFit = true; n.appendChild(v); vnodes[i] = v; },
        onTap: function () { tapSlot(i); }
      });
    });

    c.stage.appendChild(W.cropView(L.img, L.crop, overlays, { nw: L.nw, nh: L.nh }));
    paint();
    c.cap("색상판을 순서대로 끼워 넣는 것 같다.\n(홈을 다시 누르면 뺄 수 있다)");

    var tips = el("div", "row");
    ["tileBlack", "tileBrown", "tileDark", "tileBeige"].forEach(function (id) {
      if (!G.has(id)) return;
      var b3 = el("button", "chip", DATA.ITEMS[id].name);
      b3.setAttribute("data-t", "pick_" + id);
      b3.onclick = function () { G.S.sel = id; renderInv(); G.toast(DATA.ITEMS[id].name + " 선택 — 홈을 눌러 끼워봐", 1500); };
      tips.appendChild(b3);
    });
    c.panel.appendChild(tips);

    function itemOf(tile) {
      var k = { black: "tileBlack", brown: "tileBrown", dark: "tileDark", beige: "tileBeige" };
      return k[tile];
    }
    function tapSlot(i) {
      if (slots[i]) {                       /* 빼기 */
        G.give(itemOf(slots[i]));
        slots[i] = null; save(); G.sfxTap(); paint(); renderInv();
        return;
      }
      var sel = G.S.sel;
      var it = sel && DATA.ITEMS[sel];
      if (!it || !it.tile) { G.toast("색상판을 먼저 골라줘"); return; }
      if (slots.indexOf(it.tile) >= 0) { G.toast("이미 끼운 색이야"); return; }
      slots[i] = it.tile;
      G.take(sel); G.S.sel = null; save(); G.sfxTap(); paint(); renderInv();
      check();
    }
    function save() { G.S.misc.p25 = slots.slice(); G.save(); }
    function paint() {
      for (var i = 0; i < 4; i++) {
        var v = vnodes[i]; if (!v) continue;
        clear(v);
        var t = slots[i];
        v.parentNode.setAttribute("data-v", t || "-");
        if (t) { var im = new Image(); im.src = DATA.TILES[t].img; v.appendChild(im); }
      }
    }
    function check() {
      if (slots.indexOf(null) >= 0) return;
      var ok = slots.every(function (v, i) { return v === DATA.ANS.p25[i]; });
      if (ok) {
        G.sfxOk(); G.buzz([30, 40, 60]);
        G.markSolved("p25");
        G.S.misc.p25 = slots.slice(); G.save();
        setTimeout(reopenCU, 500);
      } else {
        G.sfxBad(); G.buzz(140);
        G.toast("순서가 아닌 것 같다", 1500);
      }
    }
    W.unregister();
    window.__lock = {
      answer: DATA.ANS.p25.map(function (t) { return DATA.TILES[t].label; }).join(" → "),
      force: function () {
        slots = DATA.ANS.p25.slice();
        ["tileBlack", "tileBrown", "tileDark", "tileBeige"].forEach(function (id) { G.take(id); });
        save(); paint(); renderInv(); check();
      }
    };
  };

  var audioCache = {};
  function playSong(id) {
    var idx = Object.keys(DATA.SONGS).indexOf(id);
    var n = DATA.TEMP.songOrder.indexOf(id) + 1;
    var file = "song" + n + ".mp3";
    var url = "audio/" + file;
    var have = Array.isArray(window.__AUDIO) && window.__AUDIO.indexOf(file) >= 0;
    if (!have) { tone(id); return; }
    if (audioCache[url] === undefined) {
      var a = new Audio(url);
      a.addEventListener("error", function () { audioCache[url] = null; });
      audioCache[url] = a;
    }
    var au = audioCache[url];
    if (au) {
      au.currentTime = 0;
      var p = au.play();
      if (p && p.catch) p.catch(function () { tone(id); });
      setTimeout(function () { try { au.pause(); } catch (e) {} }, 1300);
    } else tone(id);
  }
  function tone(id) {

    $("btnResume").onclick = function () { startGame(false); };
    $("btnMenu").onclick = function () {
      if (confirm("처음부터 다시 시작할까?")) { G.wipe(); location.href = location.pathname + location.search; }
    };
  }

  /* 서비스워커 */
  function sw() {
    var b = $("offlineBanner");
    if (!("serviceWorker" in navigator)) { b.className = "banner err"; b.textContent = "이 브라우저는 오프라인 저장을 못 해"; return; }
    navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(function (e) {
      b.className = "banner err"; b.textContent = "오프라인 준비 실패 — " + (e && e.message || e);
    });
    (async function poll() {
      for (var i = 0; i < 90; i++) {
        try {
          var hit = await caches.match("index.html");
          if (!hit) hit = await caches.match(new URL("index.html", location.href).href);
          if (hit) { b.className = "banner ready"; b.textContent = "오프라인 준비 완료 ✓ — 이제 인터넷 꺼도 돼"; return; }
        } catch (e) {}
        await new Promise(function (r) { setTimeout(r, i < 20 ? 400 : 2000); });
      }
    })();
  }

  window.MAIN = {
    render: render, renderInv: renderInv, openCU: openCU, closeCU: closeCU, reopenCU: reopenCU,
    openZoom: openZoom, closeZoom: closeZoom, prize: prize, story: story, transit: transit,
    ending: ending, openMinigame: openMinigame, CU: CU, ZOOM: ZOOM, startGame: startGame
  };

  document.addEventListener("DOMContentLoaded", function () {
    $("buildId").textContent = G.BUILD;
    if (G.HINTS) document.body.classList.add("hints");
    bind();
    buildDebug();
    sw();
    var had = G.load();
    if (had && S.started) $("btnResume").hidden = false;
  });
})();

</script>
</body>
</html>
